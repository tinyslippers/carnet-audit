<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1219" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet d'audit">
<meta name="description" content="Photos et notes d'audit IT d'hôtels, rangées par audit et par zone, avec export ZIP pour le rapport.">
<title>Carnet d'audit IT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/ibm-plex-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
</style>
<style>
:root {
  /* Layout : outil mobile à une colonne. Barre du haut collante, actions en bas à portée de pouce ;
     audits en fiches datées, zones en liste, photos en grille. */
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --ink: #131B2B;
  --muted: #586378;
  --line: #D6DCE5;
  --accent: #1F49C7;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E8FA;
  --ok: #1E7F4E;
  --ok-soft: #E1F3E9;
  --warn: #9C5B0B;
  --warn-soft: #FBEFD9;
  --bad: #BE2F24;
  --bad-soft: #FBE3E0;
  --shadow: 0 1px 2px rgba(19, 27, 43, .06), 0 6px 18px rgba(19, 27, 43, .06);
  --font-display: "IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 14px;
  --tap: 48px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1219;
    --surface: #161D28;
    --ink: #E6EBF2;
    --muted: #96A2B5;
    --line: #283345;
    --accent: #84A0FF;
    --accent-ink: #0A1022;
    --accent-soft: #1C2747;
    --ok: #52C890;
    --ok-soft: #12291F;
    --warn: #E5AD55;
    --warn-soft: #2E2413;
    --bad: #F3786A;
    --bad-soft: #341815;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0D1219;
  --surface: #161D28;
  --ink: #E6EBF2;
  --muted: #96A2B5;
  --line: #283345;
  --accent: #84A0FF;
  --accent-ink: #0A1022;
  --accent-soft: #1C2747;
  --ok: #52C890;
  --ok-soft: #12291F;
  --warn: #E5AD55;
  --warn-soft: #2E2413;
  --bad: #F3786A;
  --bad-soft: #341815;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button, label[role="button"] { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-weight: 500; }
.small { margin: 0; font-size: 13px; color: var(--muted); }
.ic { width: 22px; height: 22px; flex: none; }
.vh {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; opacity: 0;
}

/* ---------- Barre du haut ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 6px;
  min-height: 60px;
  padding: calc(var(--safe-top) + 8px) 10px 8px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.tb-title { flex: 1; min-width: 0; padding: 0 4px; }
.tb-title h1 {
  margin: 0; font: 600 21px/1.15 var(--font-display); letter-spacing: .005em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tb-title p { margin: 1px 0 0; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand {
  display: grid; place-items: center; width: 40px; height: 40px; margin-left: 4px;
  border-radius: 11px; background: var(--accent); color: var(--accent-ink);
}
.icon-btn {
  display: inline-grid; place-items: center; flex: none;
  width: 44px; height: 44px; padding: 0;
  border: 0; border-radius: 12px; background: transparent; color: var(--ink);
}
.icon-btn:hover { background: var(--surface); }
.icon-btn.danger { color: var(--bad); }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }
.icon-btn.sm { width: 40px; height: 40px; }

/* ---------- Vue principale ---------- */
.view {
  display: grid; gap: 18px; align-content: start;
  max-width: 760px; margin: 0 auto;
  padding: 16px 16px calc(104px + var(--safe-bottom));
}
.view:focus { outline: none; }
.loading { padding: 40px 0; color: var(--muted); }

.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: -6px; }
.sec-h h2 { margin: 0; font: 500 12.5px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 0 18px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); color: var(--ink);
  font-size: 16px; font-weight: 600; line-height: 1.15; text-align: center; text-decoration: none;
  -webkit-user-select: none; user-select: none;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 56px; font-size: 17px; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); background: transparent; }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; }
.btn.link { min-height: 36px; padding: 0 10px; border-color: transparent; background: transparent; color: var(--accent); font-size: 14px; }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* ---------- Barre d'actions ---------- */
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center; gap: 10px;
  padding: 10px 16px calc(10px + var(--safe-bottom));
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.actionbar > * { flex: 1 1 0; max-width: 360px; }
.actionbar > .grow { flex-grow: 1.8; }
.actionbar .btn, .sheet-foot .btn { padding: 0 12px; }
.actionbar:empty { display: none; }

/* ---------- Pastilles ---------- */
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.todo { background: transparent; color: var(--warn); border: 1.5px dashed color-mix(in srgb, var(--warn) 60%, transparent); }
.tag-ex {
  display: inline-block; margin-left: 6px; padding: 2px 7px; vertical-align: 3px;
  border-radius: 6px; background: var(--accent-soft); color: var(--accent);
  font: 500 11px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
}

/* ---------- Mode d'emploi ---------- */
.hint {
  display: grid; gap: 10px; padding: 16px;
  border-radius: var(--radius); background: var(--accent-soft); color: var(--ink);
}
.hint ol { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: step; }
.hint li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: baseline; counter-increment: step; font-size: 15px; }
.hint li::before {
  content: counter(step); display: grid; place-items: center; width: 26px; height: 26px;
  border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  font: 500 13px/1 var(--font-mono); transform: translateY(5px);
}
.hint p { margin: 0; font-size: 14px; color: var(--muted); }
.hint .btn { justify-self: start; }

.install {
  display: grid; gap: 10px; padding: 16px;
  border: 1.5px solid var(--accent); border-radius: var(--radius); background: var(--surface);
}
.install p { margin: 3px 0 0; font-size: 14px; color: var(--muted); }
.install p .ic { width: 18px; height: 18px; vertical-align: -3px; color: var(--accent); }
.install .btn { justify-self: start; }
.install .btn.link { margin: -6px 0 -6px -10px; }

.banner {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px;
  border-radius: 12px; background: var(--warn-soft); color: var(--ink); font-size: 14px;
}
.banner .ic { color: var(--warn); width: 20px; height: 20px; margin-top: 1px; }
.banner.bad { background: var(--bad-soft); }
.banner.bad .ic { color: var(--bad); }
.banner.info { background: var(--accent-soft); }
.banner.info .ic { color: var(--accent); }
.footnote { display: flex; gap: 8px; align-items: flex-start; margin: 0; font-size: 13px; color: var(--muted); }
.footnote .ic { width: 18px; height: 18px; margin-top: 1px; }

/* ---------- Fiches d'audit ---------- */
.alist { display: grid; gap: 12px; }
.acard {
  display: grid; grid-template-columns: 58px 1fr; gap: 14px; align-items: center;
  width: 100%; padding: 12px; text-align: left;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--shadow);
}
.adate {
  display: grid; align-content: center; justify-items: center; gap: 2px; align-self: stretch;
  min-height: 74px; padding: 6px 2px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent);
}
.adate .d { font: 600 28px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.adate .m { font: 500 12px/1.1 var(--font-mono); text-transform: uppercase; letter-spacing: .04em; }
.adate .y { font: 500 11px/1.1 var(--font-mono); opacity: .7; }
.abody { display: grid; gap: 3px; min-width: 0; }
.aname { font: 600 20px/1.15 var(--font-display); text-wrap: balance; overflow-wrap: anywhere; }
.asub { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.abody .pills { margin-top: 6px; }
.chev { color: var(--muted); }

/* ---------- En-tête d'audit ---------- */
.pj-head { display: grid; gap: 10px; }
.pj-notes {
  margin: 0; padding: 10px 12px; border-left: 3px solid var(--line);
  color: var(--muted); font-size: 14px; white-space: pre-line;
}

/* ---------- Zones ---------- */
.panel { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.zrow { display: flex; align-items: center; gap: 6px; padding-right: 10px; border-top: 1px solid var(--line); }
.zrow:first-child { border-top: 0; }
.zrow.flash { animation: flash 1.2s ease-out; }
.zmain {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  flex: 1; min-width: 0; min-height: 68px; padding: 10px 6px 10px 14px;
  border: 0; background: none; text-align: left;
}
.zcode {
  padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--muted); font-size: 12px;
}
.ztext { display: grid; gap: 2px; min-width: 0; }
.zname { font-weight: 600; overflow-wrap: anywhere; }
.zcount { font-size: 13px; color: var(--muted); }
.t-warn { color: var(--warn); font-weight: 600; }
.zstrip { display: flex; gap: 4px; }
.zstrip img { width: 38px; height: 38px; border-radius: 7px; object-fit: cover; background: var(--line); }
.zcam {
  display: grid; place-items: center; flex: none; width: 50px; height: 50px;
  border-radius: 13px; background: var(--accent-soft); color: var(--accent);
}
.zorg { display: flex; gap: 2px; }
@media (max-width: 480px) { .zstrip img:not(:last-child) { display: none; } }
@media (max-width: 340px) { .zstrip { display: none; } }

/* ---------- Grille de photos ---------- */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 12px; align-items: start; }
.ptile { display: grid; gap: 6px; padding: 0; border: 0; background: none; color: inherit; text-align: left; }
.pimg { position: relative; display: block; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 10px; background: var(--line); }
.pimg img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pimg .pnum {
  position: absolute; top: 6px; left: 6px; padding: 4px 6px; border-radius: 6px;
  background: rgba(10, 14, 22, .74); color: #fff; font: 500 11.5px/1 var(--font-mono);
}
.pimg .todo {
  position: absolute; top: 6px; right: 6px; padding: 4px 7px; border-radius: 6px;
  background: var(--warn); color: #fff; font-size: 11.5px; font-weight: 700; line-height: 1;
}
.pimg .sbar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; }
.sbar.s-ok { background: var(--ok); }
.sbar.s-warn { background: var(--warn); }
.sbar.s-bad { background: var(--bad); }
.pcap { font-size: 14.5px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.pcap.missing { color: var(--warn); font-style: italic; font-weight: 500; }
.pmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--muted); }
.pmeta .st { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.pmeta .st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.st.s-ok { color: var(--ok); } .st.s-warn { color: var(--warn); } .st.s-bad { color: var(--bad); }

.empty {
  display: grid; gap: 8px; justify-items: center; padding: 34px 18px;
  border: 1.5px dashed var(--line); border-radius: var(--radius);
  color: var(--muted); text-align: center;
}
.empty strong { color: var(--ink); font-size: 17px; }
.empty .ic { width: 30px; height: 30px; color: var(--accent); }

/* ---------- Feuilles (dialogues) ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(8, 12, 20, .5); animation: fade .18s ease-out; }
.sheet {
  position: relative; display: flex; flex-direction: column;
  width: 100%; max-width: 620px; max-height: calc(100% - var(--safe-top) - 20px);
  border-radius: 20px 20px 0 0; background: var(--surface); color: var(--ink);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .22);
  animation: up .22s cubic-bezier(.2, .8, .2, 1);
}
.sheet.full { height: calc(100% - var(--safe-top) - 10px); }
.sheet-head { display: flex; align-items: center; gap: 4px; padding: 10px 8px 10px 18px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; min-width: 0; margin: 0; font: 600 20px/1.2 var(--font-display); overflow-wrap: anywhere; }
.h-num { margin-right: 6px; padding: 2px 6px; border-radius: 6px; background: var(--ink); color: var(--surface); font-size: 14px; vertical-align: 2px; }
.sheet-body { display: grid; gap: 18px; align-content: start; padding: 16px 18px 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-foot { display: flex; gap: 10px; padding: 12px 18px calc(12px + var(--safe-bottom)); border-top: 1px solid var(--line); }
.sheet-foot > * { flex: 1 1 0; }
.sheet-foot > .small { align-self: center; }
@media (min-width: 720px) {
  .sheet-wrap { align-items: center; padding: 24px; }
  .sheet { border-radius: 20px; max-height: 90%; }
  .sheet.full { height: auto; max-height: 94%; }
  .sheet-foot { padding-bottom: 14px; }
}
@keyframes up { from { transform: translateY(28px); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }

.form { display: grid; gap: 16px; }
.lead { margin: 0; color: var(--muted); font-size: 15px; }
.field { display: grid; gap: 7px; min-width: 0; margin: 0; padding: 0; border: 0; }
.field > label, .flabel { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 380px) { .row2 { grid-template-columns: 1fr; } }
.input {
  width: 100%; min-height: var(--tap); padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 11px;
  background: var(--bg); color: var(--ink); font-size: 16px;
}
textarea.input { min-height: 100px; resize: vertical; line-height: 1.4; }
select.input { appearance: auto; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
.err { margin: 0; color: var(--bad); font-size: 13px; font-weight: 600; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 -18px; padding: 2px 18px 4px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 38px; padding: 0 13px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  font-size: 14px; font-weight: 500;
}
.chip.recent { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fname { margin: 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }

.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button {
  min-height: 46px; padding: 4px; border: 1px solid var(--line); border-radius: 11px;
  background: var(--surface); font-size: 14px; font-weight: 600; line-height: 1.15;
}
.seg .s-ok { color: var(--ok); } .seg .s-warn { color: var(--warn); } .seg .s-bad { color: var(--bad); } .seg .s-none { color: var(--muted); }
.seg button[aria-pressed="true"] { color: var(--surface); }
.seg .s-none[aria-pressed="true"] { background: var(--muted); border-color: var(--muted); }
.seg .s-ok[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
.seg .s-warn[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); }
.seg .s-bad[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); }

/* ---------- Tag : recherche ---------- */
.tagbox { position: relative; display: flex; align-items: center; gap: 6px; }
.tagbox .input { flex: 1; min-width: 0; padding-left: 42px; padding-right: 44px; font-size: 17px; font-weight: 600; }
.tagbox .input::placeholder { font-weight: 400; }
.tagbox-ic { position: absolute; left: 12px; top: 50%; display: grid; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.tagbox-ic .ic { width: 20px; height: 20px; }
.tagbox-clear {
  position: absolute; right: 4px; top: 50%; display: grid; place-items: center;
  width: 40px; height: 40px; transform: translateY(-50%);
  border: 0; border-radius: 10px; background: none; color: var(--muted);
}
.tagbox-clear .ic { width: 18px; height: 18px; }
.tagbox-cancel { display: none; flex: none; }
.sheet-body.searching .tagbox-cancel { display: inline-flex; }
.sheet-body.searching .tagbox .input { padding-right: 12px; }
.sheet-body.searching > :not(.tagfield),
.sheet-body.searching .quick,
.sheet-body.searching .fname { display: none; }
.quick .chip { min-height: 42px; font-weight: 600; }

.tag-list, .tm-list {
  margin: 0; padding: 0; list-style: none; overflow: hidden;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
}
.tag-sec {
  padding: 10px 14px 6px; background: var(--bg); color: var(--muted);
  font: 500 11.5px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase;
}
.tag-opt {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  width: 100%; min-height: 52px; padding: 14px; border: 0; border-top: 1px solid var(--line);
  background: none; color: var(--ink); font-size: 16px; font-weight: 600; text-align: left;
}
li:first-child > .tag-opt { border-top: 0; }
.tag-sec + li > .tag-opt { border-top: 0; }
.tag-opt .t-hint { flex: none; font-size: 13px; font-weight: 400; color: var(--muted); }
.tag-opt[aria-selected="true"] { color: var(--accent); }
.tag-opt[aria-selected="true"]::after { content: "✓"; margin-left: auto; color: var(--accent); }
.tag-opt.add { align-items: center; justify-content: flex-start; color: var(--accent); }
.tag-opt:active, .tag-opt:focus-visible { background: var(--accent-soft); }
.tag-empty { padding: 14px; color: var(--muted); font-size: 14px; }

/* ---------- Quantité ---------- */
.opt-hint { font-weight: 400; }
.qty { display: grid; grid-template-columns: 58px 104px 58px; gap: 8px; align-items: center; }
.qbtn {
  height: 52px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); color: var(--ink); font-size: 26px; font-weight: 500; line-height: 1;
}
.qbtn:active { background: var(--accent-soft); }
.qty .input { height: 52px; padding: 0 6px; text-align: center; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.qtyb { margin-left: 6px; color: var(--accent); font: 500 13px/1 var(--font-mono); white-space: nowrap; }

/* ---------- Notes de zone ---------- */
.znotes {
  display: grid; gap: 6px; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
}
.znotes label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.znotes label .ic { width: 18px; height: 18px; }
.znotes textarea { min-height: 64px; resize: none; overflow-y: auto; }

/* ---------- Import ---------- */
.imp-head { display: flex; gap: 12px; align-items: center; }
.imp-ic { display: grid; place-items: center; flex: none; width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
.imp-head > div { display: grid; gap: 2px; min-width: 0; }
.imp-title { font: 600 21px/1.2 var(--font-display); overflow-wrap: anywhere; }
.imp-list { display: grid; gap: 6px; margin: 0; padding: 12px 14px 12px 32px; border-radius: 12px; background: var(--bg); font-weight: 600; }

/* ---------- Gestion des tags ---------- */
.tm-row { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 4px 6px 4px 14px; border-top: 1px solid var(--line); }
.tm-list > li:first-child { border-top: 0; }
.tm-name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.tm-badge {
  margin-left: 6px; padding: 2px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
  font: 500 11px/1.3 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; vertical-align: 2px;
}

.preview {
  position: relative; display: block; width: 100%; height: clamp(150px, 28vh, 360px); padding: 0;
  overflow: hidden; border: 0; border-radius: 12px; background: #0B0F16;
}
.preview img { display: block; width: 100%; height: 100%; object-fit: contain; }
.preview-zoom {
  position: absolute; right: 8px; bottom: 8px; display: grid; place-items: center;
  width: 38px; height: 38px; border-radius: 10px; background: rgba(10, 14, 22, .65); color: #fff;
}
.preview-missing { display: grid; place-items: center; height: 100%; color: #9aa3b2; }
.meta-line { margin: 0; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

.tree {
  margin: 0; padding: 12px 14px; overflow-x: auto;
  border: 1px solid var(--line); border-radius: 11px; background: var(--bg);
  font: 500 12.5px/1.65 var(--font-mono); white-space: pre;
}
.progress { height: 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 99px; background: var(--bg); }
.progress i { display: block; width: 0; height: 100%; background: var(--accent); transition: width .15s; }
.ex-state { display: grid; gap: 8px; }
.ex-state:empty { display: none; }
.ready { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--ok-soft); }
.ready .ic { color: var(--ok); }
.ready strong { font-size: 13.5px; overflow-wrap: anywhere; }

.opt { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
.opt input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
.opt > span { display: grid; gap: 1px; }
.kv { display: flex; justify-content: space-between; gap: 12px; margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv span { color: var(--muted); }
.kv strong { text-align: right; font-variant-numeric: tabular-nums; }
.confirm-msg { margin: 0; font-size: 16px; }

/* ---------- Plein écran, attente, toast ---------- */
.viewer { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; background: #000; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.viewer .icon-btn { position: absolute; top: calc(var(--safe-top) + 10px); right: 10px; background: rgba(255, 255, 255, .14); color: #fff; }
.busy { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(8, 12, 20, .45); }
.busy-box { display: flex; gap: 12px; align-items: center; padding: 16px 20px; border-radius: 14px; background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast {
  position: fixed; left: 50%; bottom: calc(100px + var(--safe-bottom)); z-index: 95;
  max-width: calc(100% - 32px); padding: 11px 16px; transform: translateX(-50%);
  border-radius: 11px; background: var(--ink); color: var(--surface);
  font-size: 14px; font-weight: 500; box-shadow: var(--shadow); animation: fade .15s ease-out;
}

@media (prefers-reduced-motion: reduce) {
  .sheet, .sheet-backdrop, .toast, .zrow.flash { animation: none !important; }
  .spinner { animation-duration: 2.4s; }
  .progress i { transition: none; }
}

</style>

<body>
<div id="app">
  <header class="topbar" id="topbar">
    <span class="brand" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg></span>
    <div class="tb-title"><h1>Carnet d'audit</h1><p>Photos et notes d'audit IT</p></div>
  </header>
  <main id="view" class="view" tabindex="-1"><p class="loading">Ouverture du carnet…</p></main>
  <footer class="actionbar" id="actionbar"></footer>
</div>
<input type="file" id="in-camera" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input type="file" id="in-gallery" class="vh" accept="image/*" multiple tabindex="-1" aria-hidden="true">
<input type="file" id="in-import" class="vh" accept=".zip,application/zip,application/x-zip-compressed" tabindex="-1" aria-hidden="true">
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">Active JavaScript pour utiliser le carnet d'audit.</p></noscript>
<script>
/* Carnet d'audit : fonctions pures (tags, nommage, CSV, récapitulatif, ZIP). Testées sous Node. */
(function (root) {
  'use strict';

  /* Tags par défaut, avec des mots-clés pour la recherche (« tel » trouve aussi PABX et IPBX). */
  const T = (name, keywords) => ({ name, keywords });
  const DEFAULT_TAGS = [
    T('PMS', ['logiciel hôtel', 'property management', 'réservations', 'réception']),
    T('POS', ['caisse', 'point de vente', 'tpe', 'restaurant', 'bar']),
    T('Caisse', ['pos', 'point de vente', 'tpe', 'encaissement']),
    T('Micros', ['pos', 'caisse', 'restaurant', 'bar']),
    T('Door Locks', ['serrures', 'portes', 'badges', 'cartes', 'chambres']),
    T('IPTV', ['tv', 'télé', 'télévision', 'chaînes']),
    T('Encodeur', ['cartes', 'clés', 'badges', 'serrures', 'door locks']),
    T('Passport Scanner', ['scanner', 'passeport', "pièce d'identité", 'réception']),
    T('Switch', ['commutateur', 'réseau', 'lan', 'ports']),
    T('Core', ['switch cœur', 'cœur de réseau', 'backbone', 'réseau']),
    T('Firewall', ['pare-feu', 'fw', 'sécurité', 'utm']),
    T('Contrôleur', ['wifi', 'wi-fi', 'wlc', 'controller']),
    T('PABX', ['téléphonie', 'tel', 'standard', 'autocommutateur']),
    T('IPBX', ['téléphonie', 'tel', 'voip', 'toip', 'standard']),
    T('Serveur', ['server', 'srv']),
    T('Serveur VM', ['vm', 'virtualisation', 'hyperviseur', 'esxi', 'hyper-v']),
    T('Serveur Backup', ['sauvegarde', 'backup', 'nas']),
    T('AP indoor', ['wifi', 'wi-fi', 'borne', "point d'accès", 'access point', 'intérieur']),
    T('AP outdoor', ['wifi', 'wi-fi', 'borne', "point d'accès", 'access point', 'extérieur']),
    T('TV', ['télé', 'télévision', 'écran', 'iptv']),
    T('Téléphone', ['téléphonie', 'poste', 'combiné', 'dect']),
    T('Baie', ['rack', 'armoire', 'baie de brassage', 'local technique']),
    T('Climatisation', ['clim', 'froid', 'température', 'ventilation']),
    T('Workstation', ['poste de travail', 'pc', 'ordinateur']),
    T('Pointeuse', ['badgeuse', 'pointage', 'horaires']),
    T('Onduleur', ['ups', 'batterie', 'alimentation']),
    T('Routeur / Box opérateur', ['routeur', 'router', 'internet', 'fai', 'wan', 'fibre', 'lien opérateur']),
    T('Câblage / Brassage', ['câbles', 'cordons', 'jarretières', 'panneau de brassage', 'patch']),
    T('Imprimante', ['printer', 'impression', 'copieur', 'multifonction']),
  ];

  const pad = (n, w) => String(n).padStart(w, '0');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const escNl = (s) => esc(s).replace(/\r?\n/g, '<br>');

  const LIG = { 'œ': 'oe', 'Œ': 'OE', 'æ': 'ae', 'Æ': 'AE', 'ß': 'ss', 'ø': 'o', 'Ø': 'O', 'đ': 'd', 'Đ': 'D', 'ł': 'l', 'Ł': 'L' };
  const unaccent = (s) => String(s == null ? '' : s).replace(/[œŒæÆßøØđĐłŁ]/g, (ch) => LIG[ch]).normalize('NFD').replace(/[̀-ͯ]/g, '');

  /* Forme de comparaison : minuscules, sans accents ni ponctuation. */
  const normTag = (s) => unaccent(s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

  /* Nom de fichier ASCII lisible : accents retirés, casse conservée, tirets. */
  function slugify(input, max = 60) {
    let s = unaccent(input).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    if (s.length > max) {
      let cut = s.slice(0, max);
      const i = cut.lastIndexOf('-');
      if (i >= max * 0.5) cut = cut.slice(0, i);
      s = cut.replace(/-+$/, '');
    }
    return s;
  }

  /* Utilisation de chaque tag : nombre de photos et date de dernière utilisation. */
  function tagUsage(photos) {
    const u = {};
    for (const p of photos) {
      if (!p.label) continue;
      const e = u[p.label] || (u[p.label] = { count: 0, last: 0 });
      e.count++;
      e.last = Math.max(e.last, p.updatedAt || p.createdAt || 0);
    }
    return u;
  }

  /* Recherche de tags par début de mot, sur le nom puis sur les mots-clés.
     Score : 0 nom exact, 1 nom qui commence par la saisie, 2 mots du nom, 3 via un mot-clé (avec indice). */
  function searchTags(tags, query, usage = {}) {
    const q = normTag(query);
    const toks = q ? q.split(' ') : [];
    const out = [];
    for (const t of tags) {
      const n = normTag(t.name);
      const words = n.split(' ');
      const kws = (t.keywords || []).map(normTag);
      const kwWords = kws.map((k) => k.split(' '));
      let score;
      let hint = '';
      if (!toks.length) score = 4;
      else if (n === q) score = 0;
      else if (n.startsWith(q)) score = 1;
      else if (toks.every((tok) => words.some((w) => w.startsWith(tok)))) score = 2;
      else {
        const ok = toks.every((tok) => words.some((w) => w.startsWith(tok)) || kwWords.some((ws) => ws.some((w) => w.startsWith(tok))));
        if (!ok) continue;
        score = 3;
        const i = kws.findIndex((k, j) => k.startsWith(q) || toks.some((tok) => kwWords[j].some((w) => w.startsWith(tok))));
        if (i >= 0) hint = t.keywords[i];
      }
      const u = usage[t.name] || { count: 0, last: 0 };
      out.push({ tag: t, score, hint, count: u.count, last: u.last });
    }
    out.sort((a, b) => a.score - b.score || b.count - a.count || b.last - a.last || a.tag.name.localeCompare(b.tag.name, 'fr', { sensitivity: 'base' }));
    return out;
  }

  function extFor(type) {
    const t = String(type || '').toLowerCase();
    if (t.includes('png')) return 'png';
    if (t.includes('heic')) return 'heic';
    if (t.includes('heif')) return 'heif';
    if (t.includes('webp')) return 'webp';
    return 'jpg';
  }

  const sortZones = (zones) =>
    [...zones].sort((a, b) => (a.order || 0) - (b.order || 0) || (a.createdAt || 0) - (b.createdAt || 0));

  function fmtDateTime(ts) {
    const d = new Date(ts);
    if (isNaN(d)) return '';
    return `${pad(d.getDate(), 2)}/${pad(d.getMonth() + 1, 2)}/${d.getFullYear()} ${pad(d.getHours(), 2)}:${pad(d.getMinutes(), 2)}`;
  }

  function fmtIsoDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
  }

  const hasQty = (p) => typeof p.qty === 'number' && p.qty > 0;

  /* Plan d'export : un dossier par zone (dans l'ordre des zones), photos triées par numéro. */
  function buildExportPlan(project, zones, photos) {
    const root = `${project.date || 'sans-date'}_${slugify(project.hotel, 48) || 'Audit'}`;
    const zs = sortZones(zones);
    const known = new Set(zs.map((z) => z.id));
    const groups = zs.map((z) => ({ zone: z, photos: photos.filter((p) => p.zoneId === z.id) }));
    const orphans = photos.filter((p) => !known.has(p.zoneId));
    if (orphans.length) groups.push({ zone: { id: '', name: 'Sans zone', notes: '' }, photos: orphans });

    const plan = { root, zones: [], items: [] };
    const used = new Set();
    groups.forEach((g, i) => {
      const folder = `${pad(i + 1, 2)}_${slugify(g.zone.name, 40) || 'Zone'}`;
      const items = g.photos
        .slice()
        .sort((a, b) => (a.num || 0) - (b.num || 0) || (a.createdAt || 0) - (b.createdAt || 0))
        .map((p) => {
          const base = `${pad(p.num || 0, 3)}_${slugify(p.label, 60) || 'sans-tag'}`;
          const ext = extFor(p.type);
          let file = `${base}.${ext}`;
          for (let k = 2; used.has(`${folder}/${file}`); k++) file = `${base}-${k}.${ext}`;
          used.add(`${folder}/${file}`);
          const item = { photo: p, zoneName: g.zone.name, zoneIndex: i + 1, folder, file, rel: `${folder}/${file}`, path: `${root}/${folder}/${file}` };
          plan.items.push(item);
          return item;
        });
      plan.zones.push({ zone: g.zone, index: i + 1, folder, items });
    });
    return plan;
  }

  const HEAD = ['N°', 'Zone', 'Tag', 'Quantité', 'Note', 'Fichier', 'Date et heure'];

  function rowsFor(plan) {
    return plan.items.map((it) => [
      'P' + pad(it.photo.num || 0, 3),
      it.zoneName,
      it.photo.label || '',
      hasQty(it.photo) ? it.photo.qty : '',
      it.photo.note || '',
      it.rel,
      fmtDateTime(it.photo.createdAt),
    ]);
  }

  function csvCell(v) {
    let s = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(s)) s = ' ' + s; // évite qu'Excel lise la cellule comme une formule
    return /[;"\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }
  const toCsv = (rows) => '﻿' + rows.map((r) => r.map(csvCell).join(';')).join('\r\n') + '\r\n';

  /* CSV pour Excel en français : BOM UTF-8, séparateur point-virgule, fins de ligne CRLF. */
  const buildCsv = (plan) => toCsv([HEAD, ...rowsFor(plan)]);

  /* Tableau à coller dans Excel ou Word (tabulations, une ligne par photo). */
  function buildTsv(plan) {
    const clean = (v) => String(v == null ? '' : v).replace(/\t/g, ' ').replace(/\r?\n/g, ' / ');
    return [HEAD, ...rowsFor(plan)].map((r) => r.map(clean).join('\t')).join('\n');
  }

  /* Inventaire : nombre de photos et quantité totale par tag. */
  function inventory(plan) {
    const map = new Map();
    for (const it of plan.items) {
      const name = it.photo.label || '';
      if (!name) continue;
      const key = normTag(name);
      const e = map.get(key) || { name, photos: 0, qty: 0, counted: false };
      e.photos++;
      if (hasQty(it.photo)) { e.qty += it.photo.qty; e.counted = true; }
      map.set(key, e);
    }
    return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'fr', { sensitivity: 'base' }));
  }
  const buildInventoryCsv = (plan) =>
    toCsv([['Tag', 'Photos', 'Quantité totale'], ...inventory(plan).map((e) => [e.name, e.photos, e.counted ? e.qty : ''])]);

  function buildZoneNotesTxt(zone, project) {
    const text = String(zone.notes || '').trim().replace(/\r?\n/g, '\r\n');
    return `﻿${project.hotel} · ${zone.name}\r\n\r\n${text}\r\n`;
  }

  function buildGeneralNotesTxt(project) {
    const text = String(project.notes || '').trim().replace(/\r?\n/g, '\r\n');
    return `﻿${project.hotel} · notes générales\r\n\r\n${text}\r\n`;
  }

  /* ---------- Partage : données de l'app dans le ZIP, puis fusion à l'import ---------- */
  const qtyOf = (p) => (typeof p.qty === 'number' ? p.qty : null);

  function buildAuditJson(plan, project, zones, meta = {}) {
    return JSON.stringify({
      format: 'carnet-audit',
      version: 1,
      app: meta.app || '',
      exportedAt: meta.exportedAt || Date.now(),
      exportedBy: meta.exportedBy || '',
      project: {
        id: project.id, hotel: project.hotel || '', city: project.city || '', date: project.date || '',
        auditor: project.auditor || '', notes: project.notes || '', infoAt: project.infoAt || 0,
        notesAt: project.notesAt || 0, createdAt: project.createdAt || 0, example: !!project.example,
        deleted: project.deleted || {},
      },
      zones: zones.map((z) => ({
        id: z.id, name: z.name, notes: z.notes || '', order: z.order || 0,
        createdAt: z.createdAt || 0, updatedAt: z.updatedAt || 0, notesAt: z.notesAt || 0,
      })),
      photos: plan.items.map((it) => {
        const p = it.photo;
        return {
          id: p.id, zoneId: p.zoneId, num: p.num || 0, label: p.label || '', qty: qtyOf(p), note: p.note || '',
          createdAt: p.createdAt || 0, updatedAt: p.updatedAt || p.createdAt || 0,
          w: p.w || 0, h: p.h || 0, size: p.size || 0, type: p.type || 'image/jpeg', file: it.rel,
        };
      }),
    });
  }

  function isAuditJson(d) {
    return !!(d && d.format === 'carnet-audit' && d.version >= 1 && d.project && d.project.id && Array.isArray(d.zones) && Array.isArray(d.photos));
  }

  const latest = (...v) => Math.max(0, ...v.map((x) => Number(x) || 0));

  /* Fusion d'un audit reçu (inc) avec la version locale (local.project peut être null).
     - Pour chaque élément, la modification la plus récente l'emporte (info, notes, zone, photo).
     - Une suppression l'emporte sur les modifications plus anciennes, et se propage.
     - La numérotation du fichier reçu fait foi ; une photo locale absente du fichier dont le numéro est déjà pris passe à la suite. */
  function planMerge(local, inc) {
    const lp = local.project || null;
    const ip = inc.project;
    const deleted = { ...((lp && lp.deleted) || {}) };
    for (const [id, t] of Object.entries(ip.deleted || {})) deleted[id] = Math.max(deleted[id] || 0, Number(t) || 0);
    const gone = (id, ...stamps) => deleted[id] != null && deleted[id] >= latest(...stamps);
    const report = {
      isNew: !lp, photosAdded: 0, photosUpdated: 0, photosDeleted: 0, renumbered: 0,
      zonesAdded: 0, zonesUpdated: 0, zonesDeleted: 0, info: false, notes: false,
    };

    let project;
    if (!lp) {
      project = {
        id: ip.id, hotel: ip.hotel || 'Audit', city: ip.city || '', date: ip.date || '', auditor: ip.auditor || '',
        notes: ip.notes || '', infoAt: ip.infoAt || 0, notesAt: ip.notesAt || 0, createdAt: ip.createdAt || 0,
        example: !!ip.example, deleted,
      };
    } else {
      project = { ...lp, deleted };
      if ((ip.infoAt || 0) > (lp.infoAt || 0)) {
        Object.assign(project, { hotel: ip.hotel, city: ip.city, date: ip.date, auditor: ip.auditor, infoAt: ip.infoAt });
        report.info = true;
      }
      if ((ip.notesAt || 0) > (lp.notesAt || 0)) {
        Object.assign(project, { notes: ip.notes, notesAt: ip.notesAt });
        report.notes = true;
      }
    }

    const lz = new Map(local.zones.map((z) => [z.id, z]));
    const zonesPut = [];
    for (const z of inc.zones) {
      if (gone(z.id, z.updatedAt, z.notesAt, z.createdAt)) continue;
      const cur = lz.get(z.id);
      if (!cur) {
        zonesPut.push({ id: z.id, projectId: ip.id, name: z.name, notes: z.notes || '', order: z.order || 0, createdAt: z.createdAt || 0, updatedAt: z.updatedAt || 0, notesAt: z.notesAt || 0 });
        report.zonesAdded++;
        continue;
      }
      const m = { ...cur };
      let changed = false;
      if ((z.updatedAt || 0) > (cur.updatedAt || 0)) { Object.assign(m, { name: z.name, order: z.order || 0, updatedAt: z.updatedAt }); changed = true; }
      if ((z.notesAt || 0) > (cur.notesAt || 0)) { Object.assign(m, { notes: z.notes || '', notesAt: z.notesAt }); changed = true; }
      if (changed) { zonesPut.push(m); report.zonesUpdated++; }
    }
    const zonesDel = local.zones.filter((z) => gone(z.id, z.updatedAt, z.notesAt, z.createdAt)).map((z) => z.id);
    report.zonesDeleted = zonesDel.length;

    const lph = new Map(local.photos.map((p) => [p.id, p]));
    const incAlive = inc.photos.filter((p) => !gone(p.id, p.updatedAt, p.createdAt));
    const photosDel = local.photos.filter((p) => gone(p.id, p.updatedAt, p.createdAt)).map((p) => p.id);
    report.photosDeleted = photosDel.length;
    const delSet = new Set(photosDel);
    const incIds = new Set(incAlive.map((p) => p.id));

    const finalNum = new Map();
    const used = new Set();
    for (const p of incAlive) { finalNum.set(p.id, p.num); used.add(p.num); }
    const localOnly = local.photos
      .filter((p) => !delSet.has(p.id) && !incIds.has(p.id))
      .sort((a, b) => (a.num || 0) - (b.num || 0) || (a.createdAt || 0) - (b.createdAt || 0));
    const bump = [];
    for (const p of localOnly) {
      if (!p.num || used.has(p.num)) bump.push(p);
      else { used.add(p.num); finalNum.set(p.id, p.num); }
    }
    let max = Math.max(0, ...used);
    bump.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).forEach((p) => finalNum.set(p.id, ++max));

    const photosPut = [];
    for (const p of incAlive) {
      const cur = lph.get(p.id);
      if (!cur) {
        photosPut.push({
          isNew: true, file: p.file,
          photo: {
            id: p.id, projectId: ip.id, zoneId: p.zoneId, num: finalNum.get(p.id), label: p.label || '', qty: qtyOf(p),
            note: p.note || '', createdAt: p.createdAt || 0, updatedAt: p.updatedAt || p.createdAt || 0,
            w: p.w || 0, h: p.h || 0, size: p.size || 0, type: p.type || 'image/jpeg',
          },
        });
        report.photosAdded++;
        continue;
      }
      const m = { ...cur };
      let changed = false;
      if ((p.updatedAt || 0) > latest(cur.updatedAt, cur.createdAt)) {
        Object.assign(m, { label: p.label || '', qty: qtyOf(p), note: p.note || '', zoneId: p.zoneId, updatedAt: p.updatedAt });
        changed = true;
        report.photosUpdated++;
      }
      if (m.num !== finalNum.get(p.id)) {
        m.num = finalNum.get(p.id);
        if (!changed) report.renumbered++;
        changed = true;
      }
      if (changed) photosPut.push({ isNew: false, photo: m });
    }
    for (const p of localOnly) {
      if (p.num !== finalNum.get(p.id)) { photosPut.push({ isNew: false, photo: { ...p, num: finalNum.get(p.id) } }); report.renumbered++; }
    }

    project.seq = Math.max(0, ...finalNum.values());
    report.changes = report.isNew || report.info || report.notes
      || report.photosAdded + report.photosUpdated + report.photosDeleted + report.renumbered
      + report.zonesAdded + report.zonesUpdated + report.zonesDeleted > 0;
    return { project, zonesPut, zonesDel, photosPut, photosDel, report };
  }

  const RECAP_CSS = `

  /* Récapitulatif HTML autonome, placé à la racine du ZIP : il affiche les photos par chemin relatif. */
  function buildRecapHtml(plan, project, generatedAt) {
    const items = plan.items;
    const untagged = items.filter((it) => !it.photo.label).length;
    const meta = [project.city, fmtIsoDate(project.date), project.auditor ? `Auditeur : ${project.auditor}` : '']
      .filter(Boolean).map(esc).join(' · ');
    const pnum = (it) => 'P' + pad(it.photo.num || 0, 3);
    const stat = (n, label, cls = '') => `<div class="stat ${cls}"><b>${n}</b><span>${label}</span></div>`;
    const inv = inventory(plan);
    const usedZones = plan.zones.filter((z) => z.items.length || (z.zone.notes || '').trim());

    const invHtml = inv.length
      ? `<section><h2>Inventaire <small>${inv.length} tag${inv.length > 1 ? 's' : ''}</small></h2><table>
<thead><tr><th>Tag</th><th class="n">Photos</th><th class="n">Quantité</th></tr></thead><tbody>
${inv.map((e) => `<tr><td>${esc(e.name)}</td><td class="n">${e.photos}</td><td class="n">${e.counted ? e.qty : '–'}</td></tr>`).join('\n')}
</tbody></table></section>`
      : '';

    const zonesHtml = usedZones
      .map((z) => `<section><h2><span class="code">${pad(z.index, 2)}</span>${esc(z.zone.name)}<small>${z.items.length} photo${z.items.length > 1 ? 's' : ''}</small></h2>
${(z.zone.notes || '').trim() ? `<p class="notes">${escNl(z.zone.notes.trim())}</p>` : ''}
${z.items.length ? `<div class="grid">
${z.items.map((it) => {
    const p = it.photo;

<div class="cap"><span class="num">${pnum(it)}</span>${p.label ? esc(p.label) : '<span class="missing">Sans tag</span>'}${hasQty(p) ? `<span class="qty">×${p.qty}</span>` : ''}</div>

  /* ---------- ZIP (méthode « stored » : les JPEG sont déjà compressés) ---------- */
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  function dosStamp(d) {
    const year = Math.min(2107, Math.max(1980, d.getFullYear()));
    return {
      time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
      date: ((year - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(),
    };
  }

  /* entries : [{ name: 'dossier/' | 'dossier/fichier.jpg', data?: Uint8Array|ArrayBuffer, crc?: number, date?: Date }] */
  function makeZip(entries) {
    const enc = new TextEncoder();
    const parts = [];
    const central = [];
    let offset = 0;
    for (const e of entries) {
      const name = enc.encode(e.name);
      const isDir = e.name.endsWith('/');
      const data = isDir ? new Uint8Array(0) : e.data instanceof Uint8Array ? e.data : new Uint8Array(e.data || 0);
      const size = data.length;
      const crc = isDir ? 0 : typeof e.crc === 'number' ? e.crc >>> 0 : crc32(data);
      const { time, date } = dosStamp(e.date instanceof Date && !isNaN(e.date) ? e.date : new Date());

      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true); // noms en UTF-8
      lh.setUint16(8, 0, true);
      lh.setUint16(10, time, true);
      lh.setUint16(12, date, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, size, true);
      lh.setUint32(22, size, true);
      lh.setUint16(26, name.length, true);
      lh.setUint16(28, 0, true);
      parts.push(lh.buffer, name);
      if (size) parts.push(data);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, time, true);
      ch.setUint16(14, date, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, size, true);
      ch.setUint32(24, size, true);
      ch.setUint16(28, name.length, true);
      ch.setUint16(30, 0, true);
      ch.setUint16(32, 0, true);
      ch.setUint16(34, 0, true);
      ch.setUint16(36, 0, true);
      ch.setUint32(38, isDir ? 0x10 : 0, true);
      ch.setUint32(42, offset, true);
      central.push(ch.buffer, name);
      offset += 30 + name.length + size;
    }
    let cdSize = 0;
    for (const p of central) cdSize += p.byteLength;
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(4, 0, true);
    end.setUint16(6, 0, true);
    end.setUint16(8, entries.length, true);
    end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);
    end.setUint16(20, 0, true);
    return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
  }

  const api = {
    DEFAULT_TAGS, pad, esc, normTag, slugify, tagUsage, searchTags, extFor, sortZones, fmtDateTime, fmtIsoDate,
    buildExportPlan, buildCsv, buildTsv, inventory, buildInventoryCsv, buildZoneNotesTxt, buildGeneralNotesTxt,
    buildRecapHtml, buildAuditJson, isAuditJson, planMerge, crc32, makeZip,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.CarnetCore = api;
})(typeof window !== 'undefined' ? window : globalThis);

  };
  const icon = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ''}</svg>`;

  /* ---------- Utilitaires ---------- */
  function uid() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* contexte non sécurisé */ }
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}`; };
  function parseIso(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function fmtDay(iso) { const d = parseIso(iso); return d ? `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : 'Sans date'; }
  const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;

    b = b || 0;
    if (b < 1048576) return `${Math.max(1, Math.round(b / 1024))} Ko`;
    if (b < 1073741824) return `${(b / 1048576).toFixed(b < 10485760 ? 1 : 0).replace('.', ',')} Mo`;
    return `${(b / 1073741824).toFixed(1).replace('.', ',')} Go`;
  }
  const errMsg = (e) => (e && (e.message || e.name)) || 'erreur inconnue';
  const tick = () => new Promise((r) => setTimeout(r, 0));
  function blobToBuf(b) {
    if (b.arrayBuffer) return b.arrayBuffer();

  /* ---------- Stockage local ---------- */
  const DB_NAME = 'carnet-audit';
  const STORE_NAMES = ['projects', 'zones', 'photos', 'files', 'thumbs', 'meta'];

  function idbOpen() {
    return new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(DB_NAME, 1); } catch (e) { reject(e); return; }
      const timer = setTimeout(() => reject(new Error('IndexedDB ne répond pas')), 5000);
      req.onupgradeneeded = () => {
        const db = req.result;
        db.createObjectStore('projects', { keyPath: 'id' });
        db.createObjectStore('zones', { keyPath: 'id' }).createIndex('projectId', 'projectId');
        const ph = db.createObjectStore('photos', { keyPath: 'id' });
        ph.createIndex('projectId', 'projectId');
        ph.createIndex('zoneId', 'zoneId');
        db.createObjectStore('files', { keyPath: 'id' });
        db.createObjectStore('thumbs', { keyPath: 'id' });
        db.createObjectStore('meta', { keyPath: 'key' });
      };
      req.onsuccess = () => { clearTimeout(timer); resolve(req.result); };
      req.onerror = () => { clearTimeout(timer); reject(req.error || new Error('IndexedDB indisponible')); };
    });
  }

  class IdbStore {
    constructor(db) { this.db = db; }
    run(store, mode, fn) {
      return new Promise((resolve, reject) => {
        let tx;
        try { tx = this.db.transaction(store, mode); } catch (e) { reject(e); return; }
        let result;
        const r = fn(tx.objectStore(store));
        if (r) r.onsuccess = () => { result = r.result; };
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('Transaction annulée'));
      });
    }
    get(store, key) { return this.run(store, 'readonly', (os) => os.get(key)); }
    all(store) { return this.run(store, 'readonly', (os) => os.getAll()); }
    byIndex(store, index, value) { return this.run(store, 'readonly', (os) => os.index(index).getAll(value)); }
    put(store, value) { return this.run(store, 'readwrite', (os) => os.put(value)); }
    del(store, key) { return this.run(store, 'readwrite', (os) => os.delete(key)); }
    batch(ops) {
      if (!ops.length) return Promise.resolve();
      const names = [...new Set(ops.map((o) => o.store))];
      return new Promise((resolve, reject) => {
        let tx;
        try { tx = this.db.transaction(names, 'readwrite'); } catch (e) { reject(e); return; }
        for (const o of ops) {
          const os = tx.objectStore(o.store);
          if (o.type === 'put') os.put(o.value); else os.delete(o.key);
        }
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('Transaction annulée'));
      });
    }
  }

  /* Repli si le navigateur refuse IndexedDB : tout reste en mémoire jusqu'à la fermeture. */
  class MemStore {
    constructor() { this.s = {}; STORE_NAMES.forEach((n) => { this.s[n] = new Map(); }); }
    k(store) { return store === 'meta' ? 'key' : 'id'; }
    async get(store, key) { const v = this.s[store].get(key); return v ? { ...v } : undefined; }
    async all(store) { return [...this.s[store].values()].map((v) => ({ ...v })); }
    async byIndex(store, index, value) { return [...this.s[store].values()].filter((v) => v[index] === value).map((v) => ({ ...v })); }
    async put(store, value) { this.s[store].set(value[this.k(store)], { ...value }); }
    async del(store, key) { this.s[store].delete(key); }
    async batch(ops) { for (const o of ops) { if (o.type === 'put') await this.put(o.store, o.value); else await this.del(o.store, o.key); } }
  }

  async function loadSettings() {
    try { const m = await S.store.get('meta', 'settings'); if (m && m.value) Object.assign(S.settings, m.value); } catch (e) { /* réglages par défaut */ }
    if (!QUALITY[S.settings.quality]) S.settings.quality = 'std';
  }
  async function saveSettings() { try { await S.store.put('meta', { key: 'settings', value: { ...S.settings } }); } catch (e) { /* non bloquant */ } }

  /* ---------- Miniatures ---------- */
  const thumbUrls = new Map();
  async function thumbUrl(id) {
    if (thumbUrls.has(id)) return thumbUrls.get(id);
    const rec = await S.store.get('thumbs', id);
    if (!rec || !rec.buf) return '';
    const url = URL.createObjectURL(new Blob([rec.buf], { type: rec.type || 'image/jpeg' }));
    thumbUrls.set(id, url);
    return url;
  }
  function dropThumb(id) { const u = thumbUrls.get(id); if (u) { URL.revokeObjectURL(u); thumbUrls.delete(id); } }
  function hydrateThumbs(root) {
    return Promise.all($$('img[data-thumb]', root).map(async (img) => {
      try { const url = await thumbUrl(img.dataset.thumb); if (url && img.isConnected) img.src = url; } catch (e) { /* miniature absente */ }
    }));
  }

  /* ---------- Images ---------- */
  function loadImage(blob) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => resolve({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image illisible')); };
      img.src = url;
    });
  }
  function canvasToBlob(canvas, type, q) {
    return new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('Conversion impossible'))), type, q));
  }
  async function renderScaled(source, sw, sh, maxDim, q) {
    const scale = maxDim ? Math.min(1, maxDim / Math.max(sw, sh)) : 1;
    const w = Math.max(1, Math.round(sw * scale));
    const h = Math.max(1, Math.round(sh * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, w, h);
    g.drawImage(source, 0, 0, w, h);
    const blob = await canvasToBlob(c, 'image/jpeg', q);
    c.width = 0; c.height = 0; // libère la mémoire sur iOS
    return { blob, w, h };
  }
  async function processImage(file, quality) {
    const { img, url } = await loadImage(file);
    try {
      let w = img.naturalWidth, h = img.naturalHeight, full = file;
      const keep = !quality.max || (Math.max(w, h) <= quality.max && /jpe?g/i.test(file.type || ''));
      if (!keep) { const r = await renderScaled(img, w, h, quality.max, quality.q); full = r.blob; w = r.w; h = r.h; }
      const t = await renderScaled(img, img.naturalWidth, img.naturalHeight, 480, 0.72);
      return { full, type: keep ? (file.type || 'image/jpeg') : 'image/jpeg', thumb: t.blob, w, h };
    } finally { URL.revokeObjectURL(url); }
  }

  async function addPhoto(zone, file) {
    const project = await S.store.get('projects', zone.projectId);
    if (!project) throw new Error('Audit introuvable');
    const img = await processImage(file, QUALITY[S.settings.quality] || QUALITY.std);
    const fullBuf = await blobToBuf(img.full);
    const thumbBuf = await blobToBuf(img.thumb);
    const now = Date.now();
    project.seq = (project.seq || 0) + 1;
    project.updatedAt = now;
    const photo = {
      id: uid(), projectId: project.id, zoneId: zone.id, num: project.seq,
      label: '', qty: null, note: '',
      createdAt: now, updatedAt: now, w: img.w, h: img.h, size: fullBuf.byteLength, type: img.type,
    };
    await S.store.batch([
      { store: 'files', type: 'put', value: { id: photo.id, buf: fullBuf, type: img.type, crc: C.crc32(new Uint8Array(fullBuf)) } },
      { store: 'thumbs', type: 'put', value: { id: photo.id, buf: thumbBuf, type: 'image/jpeg' } },
      { store: 'photos', type: 'put', value: photo },
      { store: 'projects', type: 'put', value: project },
    ]);
    return photo;
  }

  /* Supprime des photos. Avec projectId, la suppression est mémorisée pour se propager lors d'un partage. */
  async function deletePhotos(ids, projectId = null, alsoDeleted = []) {
    const ops = [];
    ids.forEach((id) => { ops.push({ store: 'photos', type: 'del', key: id }, { store: 'files', type: 'del', key: id }, { store: 'thumbs', type: 'del', key: id }); dropThumb(id); });
    if (projectId) {
      const p = await S.store.get('projects', projectId);
      if (p) {
        const now = Date.now();
        p.deleted = { ...(p.deleted || {}) };
        [...ids, ...alsoDeleted].forEach((id) => { p.deleted[id] = now; });
        ops.push({ store: 'projects', type: 'put', value: p });
      }
    }
    await S.store.batch(ops);
  }
  async function deleteZone(zoneId) {
    const z = await S.store.get('zones', zoneId);
    const ps = await S.store.byIndex('photos', 'zoneId', zoneId);
    await deletePhotos(ps.map((p) => p.id), z ? z.projectId : null, [zoneId]);
    await S.store.del('zones', zoneId);
  }
  async function deleteProject(projectId) {
    const ps = await S.store.byIndex('photos', 'projectId', projectId);
    await deletePhotos(ps.map((p) => p.id));
    const zs = await S.store.byIndex('zones', 'projectId', projectId);
    await S.store.batch([...zs.map((z) => ({ store: 'zones', type: 'del', key: z.id })), { store: 'projects', type: 'del', key: projectId }]);
  }

    };
    const zoneDefs = [
      ['Local technique RDC', 'Accès par badge, clé chez le gardien de nuit.\nPas de climatisation : 28 °C mesurés dans le local.'],
      ['Réception', '2 postes de réception et 1 encodeur de cartes.\nInterlocuteur : responsable de réception.'],
      ['Étage 2, couloir', ''],
    ];
    const zones = zoneDefs.map(([name, notes], i) => ({ id: uid(), projectId: pid, name, notes, order: i, createdAt: now + i, updatedAt: now + i, notesAt: notes ? now : 0 }));
    const shots = [
      { z: 0, kind: 'rack', label: 'Baie', qty: 1, note: 'Panneau 2 non étiqueté, cordons trop longs. Porte de baie non verrouillée.' },
      { z: 0, kind: 'switch', label: 'Switch', qty: 2, note: 'Modèle et version du firmware à relever sur l’interface d’administration.' },
      { z: 0, kind: 'ups', label: 'Onduleur', qty: 1, note: 'Autonomie affichée : 18 min. Date du dernier test batterie inconnue.' },
      { z: 1, kind: 'reception', label: 'PMS', qty: 2, note: 'Sessions PMS ouvertes sans verrouillage automatique de l’écran.' },
      { z: 1, kind: 'cables', label: '', qty: null, note: '' },
      { z: 2, kind: 'ap', label: 'AP indoor', qty: 1, note: 'SSID clients et SSID personnel diffusés. Signal correct en bout de couloir.' },
    ];
    const ops = [{ store: 'projects', type: 'put', value: project }, ...zones.map((z) => ({ store: 'zones', type: 'put', value: z }))];
    for (let i = 0; i < shots.length; i++) {
      const s = shots[i];
      const canvas = drawExample(s.kind, 1600, 1200);
      const full = await canvasToBlob(canvas, 'image/jpeg', 0.85);
      const t = await renderScaled(canvas, 1600, 1200, 480, 0.72);
      canvas.width = 0; canvas.height = 0;
      const fullBuf = await blobToBuf(full);
      const thumbBuf = await blobToBuf(t.blob);
      const id = uid();
      const ts = now - (shots.length - i) * 7 * 60000;
      ops.push(
        { store: 'files', type: 'put', value: { id, buf: fullBuf, type: 'image/jpeg', crc: C.crc32(new Uint8Array(fullBuf)) } },
        { store: 'thumbs', type: 'put', value: { id, buf: thumbBuf, type: 'image/jpeg' } },
        { store: 'photos', type: 'put', value: { id, projectId: pid, zoneId: zones[s.z].id, num: i + 1, label: s.label, qty: s.qty, note: s.note, createdAt: ts, updatedAt: ts, w: 1600, h: 1200, size: fullBuf.byteLength, type: 'image/jpeg' } }
      );
    }
    project.seq = shots.length;
    await S.store.batch(ops);
    return pid;
  }

  /* ---------- Tags ---------- */
  async function loadTags() {
    try {
      const m = await S.store.get('meta', 'tags');
      const v = (m && m.value) || {};
      S.tagMeta = { custom: Array.isArray(v.custom) ? v.custom : [], hidden: Array.isArray(v.hidden) ? v.hidden : [] };
    } catch (e) { S.tagMeta = { custom: [], hidden: [] }; }
  }
  async function saveTags() {
    try { await S.store.put('meta', { key: 'tags', value: { custom: [...S.tagMeta.custom], hidden: [...S.tagMeta.hidden] } }); }
    catch (e) { toast('Enregistrement des tags impossible'); }
  }
  const byName = (a, b) => a.name.localeCompare(b.name, 'fr', { sensitivity: 'base' });
  function allTags() {
    const hidden = new Set(S.tagMeta.hidden.map(C.normTag));
    const list = C.DEFAULT_TAGS.filter((t) => !hidden.has(C.normTag(t.name))).map((t) => ({ ...t, custom: false }));
    const seen = new Set(list.map((t) => C.normTag(t.name)));
    for (const name of S.tagMeta.custom) {
      const k = C.normTag(name);
      if (k && !seen.has(k)) { seen.add(k); list.push({ name, keywords: [], custom: true }); }
    }
    return list;
  }
  const isDefaultTag = (name) => C.DEFAULT_TAGS.some((t) => C.normTag(t.name) === C.normTag(name));
  async function addCustomTag(raw) {
    const name = String(raw || '').trim().replace(/\s+/g, ' ').slice(0, 60);
    const k = C.normTag(name);
    if (!k) return '';
    const existing = allTags().find((t) => C.normTag(t.name) === k);
    if (existing) return existing.name;
    const def = C.DEFAULT_TAGS.find((t) => C.normTag(t.name) === k);
    if (def) {
      S.tagMeta.hidden = S.tagMeta.hidden.filter((h) => C.normTag(h) !== k);
      await saveTags();
      return def.name;
    }
    S.tagMeta.custom.push(name);
    await saveTags();
    return name;
  }
  async function removeTag(name) {
    const k = C.normTag(name);
    if (isDefaultTag(name)) { if (!S.tagMeta.hidden.some((h) => C.normTag(h) === k)) S.tagMeta.hidden.push(name); }
    else S.tagMeta.custom = S.tagMeta.custom.filter((c) => C.normTag(c) !== k);
    await saveTags();
  }
  /* Tags rapides : ceux de l'audit en cours d'abord, puis les autres audits, puis une sélection par défaut. */
  function quickTags(projectPhotos, allPhotos, excludeId) {
    const out = [];
    const push = (n) => { if (n && out.length < 6 && !out.some((x) => C.normTag(x) === C.normTag(n))) out.push(n); };
    const recent = (arr) => arr.filter((p) => p.label && p.id !== excludeId).sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt));
    recent(projectPhotos).forEach((p) => push(p.label));
    recent(allPhotos).forEach((p) => push(p.label));
    const known = new Set(allTags().map((t) => C.normTag(t.name)));
    DEFAULT_QUICK.filter((n) => known.has(C.normTag(n))).forEach(push);
    return out;
  }

  /* ---------- Notes générales et notes de zone (enregistrement automatique) ---------- */
  const pendingNotes = { timer: 0, kind: '', id: null, value: '' };
  async function flushNotes() {
    clearTimeout(pendingNotes.timer);
    if (!pendingNotes.id) return;
    const { kind, id, value } = pendingNotes;
    pendingNotes.id = null;
    const store = kind === 'project' ? 'projects' : 'zones';
    try {
      const rec = await S.store.get(store, id);
      if (rec && (rec.notes || '') !== value) { rec.notes = value; rec.notesAt = Date.now(); await S.store.put(store, rec); }
    } catch (e) { toast('Notes non enregistrées : ' + errMsg(e)); }
  }
  function autoGrow(t) {
    t.style.height = 'auto';
    t.style.height = `${Math.min(t.scrollHeight + 2, Math.round(window.innerHeight * 0.45))}px`;
  }

  /* ---------- Version installable (PWA) ---------- */
  const PWA = !!document.querySelector('link[rel="manifest"]');
  const isInstalled = () => { try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; } };
  const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let installPrompt = null;

  function setupPwa() {
    if (!PWA || S.inFrame) return;
    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service worker :', e));
    }
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      installPrompt = e;
      if (current().name === 'home' && !S.sheets.length) render(true);
    });
    window.addEventListener('appinstalled', () => {
      installPrompt = null;
      toast('Carnet installé sur l’écran d’accueil');
      if (current().name === 'home' && !S.sheets.length) render(true);
    });

  function installCard() {
    if (!PWA || S.inFrame || isInstalled() || S.settings.installDismissed) return '';
    let how;
    if (installPrompt) how = `<button type="button" class="btn primary sm" data-act="install">${icon('download')} Installer l’app</button>`;
    else if (isIOS()) how = `<p>Dans Safari, touche ${icon('share')} <strong>Partager</strong>, puis <strong>Sur l’écran d’accueil</strong>.</p>`;
    else how = '<p>Ouvre le menu du navigateur, puis <strong>Installer l’application</strong> ou <strong>Ajouter à l’écran d’accueil</strong>.</p>';

  /* ---------- Navigation ---------- */
  const current = () => S.nav[S.nav.length - 1];
  function go(route) {
    S.organize = false;
    S.nav.push(route);
    if (S.useHistory) { try { history.pushState({ depth: S.nav.length - 1 }, ''); } catch (e) { S.useHistory = false; } }
    render().then(() => window.scrollTo(0, 0));
  }
  function back() {
    if (S.nav.length <= 1) return;
    if (S.useHistory) { history.back(); return; }
    S.nav.pop(); S.organize = false; render();
  }
  function setupHistory() {
    if (S.inFrame || !window.history || !history.pushState) return;
    try { history.replaceState({ depth: 0 }, ''); } catch (e) { return; }
    S.useHistory = true;
    window.addEventListener('popstate', async (ev) => {
      const depth = ev.state && typeof ev.state.depth === 'number' ? ev.state.depth : 0;
      await closeAllSheets();
      S.nav = S.nav.slice(0, Math.max(1, depth + 1));
      S.organize = false;
      render();

  }

  /* ---------- Rendu ---------- */
  function summarize(photos) {
    const s = { photos: photos.length, todo: 0, bytes: 0 };
    for (const p of photos) {
      if (!p.label) s.todo++;
      s.bytes += p.size || 0;
    }
    return s;
  }
  const pill = (text, cls = '') => `<span class="pill ${cls}">${text}</span>`;
  function statPills(s, zones) {
    const out = [];
    if (zones !== undefined) out.push(pill(plural(zones, 'zone', 'zones')));
    out.push(pill(plural(s.photos, 'photo', 'photos')));
    if (s.todo) out.push(pill(`${s.todo} à taguer`, 'todo'));
    return `<div class="pills">${out.join('')}</div>`;
  }
  const qtyBadge = (p) => (typeof p.qty === 'number' && p.qty > 0 ? `<span class="qtyb">×${p.qty}</span>` : '');
  function excerpt(text, max = 70) {
    const t = String(text || '').replace(/\s+/g, ' ').trim();
    return t.length > max ? `${t.slice(0, max - 1).replace(/\s+\S*$/, '')}…` : t;

  function topbar({ back: hasBack = false, title, sub = '', right = '' }) {

  async function render(keepScroll = false) {

      if (r.name === 'home') out = await viewHome();
