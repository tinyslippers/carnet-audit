  /* ---------- Feuilles ---------- */
  let sheetSeq = 0;
  function openSheet({ title, body, foot = '', full = false, headExtra = '', onClose = null }) {
    const id = 'sh' + ++sheetSeq;
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML = `<div class="sheet-backdrop" data-sheet-dismiss></div>
      <section class="sheet${full ? ' full' : ''}" role="dialog" aria-modal="true" aria-labelledby="${id}">
        <header class="sheet-head"><h2 id="${id}">${title}</h2>${headExtra}<button type="button" class="icon-btn" data-sheet-dismiss aria-label="Fermer">${icon('close')}</button></header>
        <div class="sheet-body">${body}</div>${foot ? `<footer class="sheet-foot">${foot}</footer>` : ''}
      </section>`;
    const prev = document.activeElement;
    const entry = {
      el: wrap,
      closed: false,
      async close() {
        if (entry.closed) return;
        entry.closed = true;
        try { if (onClose) await onClose(); } catch (e) { console.error(e); }
        wrap.remove();
        S.sheets = S.sheets.filter((x) => x !== entry);
        if (!S.sheets.length) document.body.classList.remove('lock');
        if (prev && prev.isConnected && prev.focus) { try { prev.focus({ preventScroll: true }); } catch (e) { /* ignoré */ } }
      },
    };
    wrap.addEventListener('click', (e) => { if (e.target.closest('[data-sheet-dismiss]')) { e.preventDefault(); entry.close(); } });
    document.body.appendChild(wrap);
    document.body.classList.add('lock');
    S.sheets.push(entry);
    requestAnimationFrame(() => { const f = $('.sheet-head [data-sheet-dismiss]', wrap); if (f) f.focus({ preventScroll: true }); });
    return entry;
  }
  async function closeAllSheets() { for (const s of [...S.sheets].reverse()) await s.close(); }

  function confirmBox(message, { ok = 'Supprimer', title = 'Confirmer' } = {}) {
    return new Promise((resolve) => {
      let done = false;
      const sh = openSheet({
        title,
        body: `<p class="confirm-msg">${message}</p>`,
        foot: `<button type="button" class="btn" data-cf="no">Annuler</button><button type="button" class="btn danger-fill" data-cf="yes">${ok}</button>`,
        onClose: () => { if (!done) { done = true; resolve(false); } },
      });
      sh.el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-cf]');
        if (!b) return;
        done = true;
        resolve(b.dataset.cf === 'yes');
        sh.close();
      });
    });
  }

  function openViewer(url) {
    const v = document.createElement('div');
    v.className = 'viewer';
    v.setAttribute('role', 'dialog');
    v.setAttribute('aria-label', 'Photo en plein écran');
    v.innerHTML = `<img src="${url}" alt=""><button type="button" class="icon-btn" aria-label="Fermer">${icon('close')}</button>`;
    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
    function close() { v.remove(); document.removeEventListener('keydown', onKey, true); }
    v.addEventListener('click', (e) => { if (e.target.closest('button') || e.target === v) close(); });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(v);
    $('button', v).focus();
  }

  /* Fiche d'une photo : tag (recherche), quantité, note, zone. Tout est enregistré automatiquement. */
  async function openPhotoSheet(photoId) {
    const ph = await S.store.get('photos', photoId);
    if (!ph) return;
    const [zonesRaw, projectPhotos, everyPhoto, fileRec] = await Promise.all([
      S.store.byIndex('zones', 'projectId', ph.projectId),
      S.store.byIndex('photos', 'projectId', ph.projectId),
      S.store.all('photos'),
      S.store.get('files', photoId),
    ]);
    const zones = C.sortZones(zonesRaw);
    const zoneName = (id) => (zones.find((z) => z.id === id) || {}).name || '';
    const fullUrl = fileRec && fileRec.buf ? URL.createObjectURL(new Blob([fileRec.buf], { type: fileRec.type || 'image/jpeg' })) : '';
    const usage = C.tagUsage(everyPhoto);
    const quick = quickTags(projectPhotos, everyPhoto, ph.id);
    const st = { label: ph.label || '', qty: typeof ph.qty === 'number' ? ph.qty : null, zoneId: ph.zoneId };
    const PLACEHOLDER = 'Rechercher : switch, tel, clim…';

    const body = `
      <button type="button" class="preview" data-local="zoom" aria-label="Agrandir la photo">${fullUrl ? `<img src="${fullUrl}" alt="">` : '<span class="preview-missing">Image introuvable</span>'}<span class="preview-zoom">${icon('zoom')}</span></button>
      <div class="field tagfield">
        <label for="f-tag">Tag</label>
        <div class="tagbox">
          <span class="tagbox-ic">${icon('search')}</span>
          <input id="f-tag" class="input" type="text" value="${esc(st.label)}" placeholder="${PLACEHOLDER}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="f-tag-list">
          <button type="button" class="tagbox-clear" data-local="clear" aria-label="Retirer le tag"${st.label ? '' : ' hidden'}>${icon('close')}</button>
          <button type="button" class="btn link tagbox-cancel" data-local="cancel">Annuler</button>
        </div>
        <div class="chips scroll quick" role="group" aria-label="Tags rapides">${quick.map((n) => `<button type="button" class="chip" data-quick="${esc(n)}" aria-pressed="false">${esc(n)}</button>`).join('')}</div>
        <ul class="tag-list" id="f-tag-list" role="listbox" aria-label="Tags" hidden></ul>
        <p class="fname mono" id="f-fname"></p>
      </div>
      <div class="field">
        <label for="f-qty">Quantité <span class="opt-hint">· facultatif</span></label>
        <div class="qty">
          <button type="button" class="qbtn" data-qty="-1" aria-label="Diminuer la quantité">−</button>
          <input id="f-qty" class="input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" enterkeyhint="done" placeholder="–" value="${st.qty == null ? '' : st.qty}">
          <button type="button" class="qbtn" data-qty="1" aria-label="Augmenter la quantité">+</button>
        </div>
      </div>
      <div class="field">
        <label for="f-note">Note</label>
        <textarea id="f-note" class="input" rows="3" placeholder="Constat, modèle, numéro de série, recommandation…">${esc(ph.note)}</textarea>
      </div>
      <div class="field">
        <label for="f-zone">Zone</label>
        <select id="f-zone" class="input">${zones.map((z, i) => `<option value="${z.id}"${z.id === st.zoneId ? ' selected' : ''}>Z${pad(i + 1, 2)} · ${esc(z.name)}</option>`).join('')}</select>
      </div>
      <p class="meta-line">Prise le ${esc(C.fmtDateTime(ph.createdAt))}${ph.w ? ` · ${ph.w} × ${ph.h} px` : ''} · ${fmtSize(ph.size)}</p>`;
    const foot = `<label class="btn" for="in-camera" data-capture="${st.zoneId}" id="f-next" role="button" tabindex="0">${icon('camera')} Photo suivante</label>
      <button type="button" class="btn primary" data-sheet-dismiss>${icon('check')} Terminé</button>`;
    const headExtra = `<button type="button" class="icon-btn danger" data-local="delete" aria-label="Supprimer la photo">${icon('trash')}</button>`;

    let timer = 0, dirty = false, deleted = false, searching = false, typed = false;
    const sheet = openSheet({
      title: `<span class="mono h-num">P${pad(ph.num, 3)}</span><span class="h-zone">${esc(zoneName(st.zoneId))}</span>`,
      body, foot, headExtra, full: true,
      onClose: async () => {
        await commit();
        if (fullUrl) URL.revokeObjectURL(fullUrl);
        if (S.activePhoto && S.activePhoto.id === ph.id) S.activePhoto = null;
        if (!deleted) render(true);
      },
    });
    const el = sheet.el;
    const sb = $('.sheet-body', el);
    const field = $('.tagfield', el);
    const inTag = $('#f-tag', el), list = $('#f-tag-list', el), clearBtn = $('.tagbox-clear', el);
    const inQty = $('#f-qty', el), inNote = $('#f-note', el), inZone = $('#f-zone', el), fname = $('#f-fname', el), next = $('#f-next', el);

    const updFname = () => { fname.textContent = `Nom du fichier : ${pad(ph.num, 3)}_${C.slugify(st.label, 60) || 'sans-tag'}.${C.extFor(ph.type)}`; };
    const updQuick = () => {
      $$('[data-quick]', el).forEach((c) => c.setAttribute('aria-pressed', String(!!st.label && C.normTag(c.dataset.quick) === C.normTag(st.label))));
      clearBtn.hidden = !st.label || searching;
    };
    const schedule = () => { dirty = true; clearTimeout(timer); timer = setTimeout(flush, 400); };
    async function flush() {
      clearTimeout(timer);
      if (!dirty || deleted) return;
      dirty = false;
      try {
        const cur = await S.store.get('photos', ph.id);
        if (!cur) return;
        Object.assign(cur, { label: st.label, qty: st.qty, note: inNote.value.trim(), zoneId: st.zoneId, updatedAt: Date.now() });
        delete cur.category;
        delete cur.status;
        await S.store.put('photos', cur);
      } catch (e) { toast('Enregistrement impossible : ' + errMsg(e)); }
    }
    async function commit() { if (searching) closeSearch(true); await flush(); }
    S.activePhoto = { id: ph.id, flush: commit };

    function setLabel(name) {
      st.label = String(name || '').trim().replace(/\s+/g, ' ').slice(0, 60);
      inTag.value = st.label;
      updFname(); updQuick(); schedule();
    }
    const option = (name, hint, selected) => `<li role="none"><button type="button" class="tag-opt" role="option" data-tag="${esc(name)}" aria-selected="${selected}"><span class="t-name">${esc(name)}</span>${hint ? `<span class="t-hint">${esc(hint)}</span>` : ''}</button></li>`;
    function renderList(q) {
      const tags = allTags();
      const cur = C.normTag(st.label);
      const query = q.trim();
      let html = '';
      if (!query) {
        if (quick.length) html += `<li class="tag-sec" role="presentation">Suggestions</li>${quick.map((n) => option(n, '', C.normTag(n) === cur)).join('')}`;
        html += `<li class="tag-sec" role="presentation">Tous les tags · ${tags.length}</li>${[...tags].sort(byName).map((t) => option(t.name, '', C.normTag(t.name) === cur)).join('')}`;
      } else {
        const res = C.searchTags(tags, query, usage).slice(0, 12);
        if (!res.length) html += '<li class="tag-empty" role="presentation">Aucun tag ne correspond.</li>';
        html += res.map((r) => option(r.tag.name, r.hint, C.normTag(r.tag.name) === cur)).join('');
        if (!tags.some((t) => C.normTag(t.name) === C.normTag(query))) {
          html += `<li role="none"><button type="button" class="tag-opt add" role="option" data-add="${esc(query)}">${icon('plus')}<span>Ajouter le tag « ${esc(query)} »</span></button></li>`;
        }
      }
      list.innerHTML = html;
    }
    function openSearch() {
      if (searching) return;
      searching = true;
      typed = false;
      sb.classList.add('searching');
      inTag.value = '';
      inTag.placeholder = st.label ? `${st.label} · tape pour changer` : PLACEHOLDER;
      inTag.setAttribute('aria-expanded', 'true');
      renderList('');
      list.hidden = false;
      updQuick();
      sb.scrollTop = 0;
    }
    function closeSearch(keepTyped) {
      if (!searching) return;
      searching = false;
      sb.classList.remove('searching');
      list.hidden = true;
      inTag.setAttribute('aria-expanded', 'false');
      inTag.placeholder = PLACEHOLDER;
      const txt = inTag.value.trim();
      if (keepTyped && typed && txt) {
        const hit = allTags().find((t) => C.normTag(t.name) === C.normTag(txt));
        setLabel(hit ? hit.name : txt);
      } else {
        inTag.value = st.label;
        updQuick();
      }
    }
    async function pick(btn) {
      const isAdd = btn.hasAttribute('data-add');
      const name = isAdd ? await addCustomTag(btn.dataset.add) : btn.dataset.tag;
      if (!name) return;
      closeSearch(false);
      setLabel(name);
      inTag.blur();
      if (isAdd) toast(`Tag « ${name} » ajouté à la liste`);
    }

    updFname();
    updQuick();
    inTag.addEventListener('focus', openSearch);
    inTag.addEventListener('input', () => { typed = true; renderList(inTag.value); });
    inTag.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const first = $('[data-tag], [data-add]', list);
        if (typed && inTag.value.trim() && first) pick(first);
        else { closeSearch(false); inTag.blur(); }
      } else if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        closeSearch(false);
        inTag.blur();
      }
    });
    inTag.addEventListener('blur', () => {
      setTimeout(() => { if (searching && !field.contains(document.activeElement)) closeSearch(true); }, 0);
    });
    // Garder le focus dans la recherche quand on touche une suggestion ou « Annuler ».
    list.addEventListener('mousedown', (e) => e.preventDefault());
    $('.tagbox-cancel', el).addEventListener('mousedown', (e) => e.preventDefault());
    list.addEventListener('click', (e) => { const b = e.target.closest('[data-tag], [data-add]'); if (b) pick(b); });

    const setQty = (v) => {
      st.qty = v == null || isNaN(v) ? null : Math.max(0, Math.min(9999, Math.round(v)));
      inQty.value = st.qty == null ? '' : String(st.qty);
      schedule();
    };
    inQty.addEventListener('input', () => {
      const digits = inQty.value.replace(/\D/g, '').slice(0, 4);
      if (digits !== inQty.value) inQty.value = digits;
      st.qty = digits ? parseInt(digits, 10) : null;
      schedule();
    });
    inQty.addEventListener('focus', () => { try { inQty.select(); } catch (e) { /* ignoré */ } });
    inQty.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); inQty.blur(); } });
    inNote.addEventListener('input', schedule);
    inZone.addEventListener('change', () => {
      st.zoneId = inZone.value;
      next.dataset.capture = st.zoneId;
      $('.h-zone', el).textContent = zoneName(st.zoneId);
      schedule();
    });

    el.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-quick], [data-qty], [data-local]');
      if (!b) return;
      if (b.hasAttribute('data-quick')) {
        setLabel(C.normTag(b.dataset.quick) === C.normTag(st.label) ? '' : b.dataset.quick);
      } else if (b.hasAttribute('data-qty')) {
        const d = Number(b.dataset.qty);
        if (st.qty == null) setQty(d > 0 ? 1 : null);
        else setQty(st.qty + d <= 0 ? null : st.qty + d);
      } else if (b.dataset.local === 'clear') {
        setLabel('');
      } else if (b.dataset.local === 'cancel') {
        closeSearch(false);
        inTag.blur();
      } else if (b.dataset.local === 'zoom') {
        if (fullUrl) openViewer(fullUrl);
      } else if (b.dataset.local === 'delete') {
        const ok = await confirmBox(`Supprimer la photo P${pad(ph.num, 3)} ? Elle sera effacée de cet appareil.`, { ok: 'Supprimer' });
        if (!ok) return;
        deleted = true;
        clearTimeout(timer);
        await deletePhotos([ph.id], ph.projectId);
        await sheet.close();
        toast('Photo supprimée');
        render(true);
      }
    });
  }

  async function openZoneSheet(projectId, zone, { first = false } = {}) {
    const isNew = !zone;
    const existing = await S.store.byIndex('zones', 'projectId', projectId);
    const body = `<form id="zn-form" class="form" novalidate>
      ${first ? '<p class="lead">Ajoute la première zone visitée. Tu pourras en créer d’autres à tout moment.</p>' : ''}
      <div class="field"><label for="zn-name">Nom de la zone</label><input id="zn-name" class="input" value="${esc(zone ? zone.name : '')}" placeholder="Ex. Local technique RDC" autocomplete="off" enterkeyhint="done"><p class="err" id="zn-err" hidden>Indique un nom de zone.</p></div>
      <div class="chips" role="group" aria-label="Zones courantes">${ZONE_PRESETS.map((z) => `<button type="button" class="chip" data-preset="${esc(z)}">${esc(z)}</button>`).join('')}</div>
      ${isNew ? '' : `<button type="button" class="btn danger" data-local="delete-zone">${icon('trash')} Supprimer cette zone</button>`}
    </form>`;
    const foot = `<button type="button" class="btn" data-sheet-dismiss>${first ? 'Plus tard' : 'Annuler'}</button><button type="submit" form="zn-form" class="btn primary" id="zn-submit">${isNew ? 'Ajouter la zone' : 'Renommer'}</button>`;
    const sheet = openSheet({ title: isNew ? 'Nouvelle zone' : 'Modifier la zone', body, foot });
    const form = $('#zn-form', sheet.el);
    const input = $('#zn-name', form);
    sheet.el.addEventListener('click', async (e) => {
      const chipEl = e.target.closest('[data-preset]');
      if (chipEl) {
        const base = chipEl.dataset.preset;
        const taken = (n) => existing.some((z) => (!zone || z.id !== zone.id) && z.name.toLowerCase() === n.toLowerCase());
        let name = base;
        for (let k = 2; taken(name); k++) name = `${base} ${k}`;
        input.value = name;
        $('#zn-err', form).hidden = true;
        return;
      }
      if (e.target.closest('[data-local="delete-zone"]')) {
        const ps = await S.store.byIndex('photos', 'zoneId', zone.id);
        const ok = await confirmBox(`Supprimer la zone « ${esc(zone.name)} »${ps.length ? ` et ses ${plural(ps.length, 'photo', 'photos')}` : ''} ?`, { ok: 'Supprimer la zone' });
        if (!ok) return;
        await deleteZone(zone.id);
        await sheet.close();
        if (current().name === 'zone' && current().id === zone.id) back(); else render(true);
        toast('Zone supprimée');
      }
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) { $('#zn-err', form).hidden = false; input.focus(); return; }
      try {
        if (isNew) {
          const order = existing.reduce((m, z) => Math.max(m, z.order || 0), -1) + 1;
          const t = Date.now();
          const nz = { id: uid(), projectId, name, notes: '', order, createdAt: t, updatedAt: t, notesAt: 0 };
          await S.store.put('zones', nz);
          S.flashZone = nz.id;
          await sheet.close();
          await render(true);
          toast(`Zone « ${name} » ajoutée`);
        } else {
          const cur = await S.store.get('zones', zone.id);
          cur.name = name;
          cur.updatedAt = Date.now();
          await S.store.put('zones', cur);
          await sheet.close();
          render(true);
        }
      } catch (err) { toast('Enregistrement impossible : ' + errMsg(err)); }
    });
  }

  async function moveZone(zoneId, dir) {
    const r = current();
    if (r.name !== 'project') return;
    const zs = C.sortZones(await S.store.byIndex('zones', 'projectId', r.id));
    const i = zs.findIndex((z) => z.id === zoneId), j = i + dir;
    if (i < 0 || j < 0 || j >= zs.length) return;
    [zs[i], zs[j]] = [zs[j], zs[i]];
    await S.store.batch(zs.map((z, k) => ({ store: 'zones', type: 'put', value: { ...z, order: k, updatedAt: z.order === k ? z.updatedAt : Date.now() } })));
    await render(true);
    const btn = $(`[data-act="${dir < 0 ? 'zone-up' : 'zone-down'}"][data-id="${zoneId}"]`);
    if (btn && !btn.disabled) btn.focus({ preventScroll: true });
  }

  /* ---------- Export ---------- */
  function buildTree(plan, project) {
    const rows = plan.zones.map((z) => [`${z.folder}/`, `${plural(z.items.length, 'photo', 'photos')}${(z.zone.notes || '').trim() ? ' + notes' : ''}`]);
    if ((project.notes || '').trim()) rows.push(['notes-generales.txt', 'notes de l’hôtel']);
    rows.push(['notes.csv', 'tableau'], ['inventaire.csv', 'tags et quantités'], ['recapitulatif.html', 'à imprimer'], ['audit.json', 'pour l’import dans l’app']);
    const w = Math.max(...rows.map((r) => r[0].length));
    return [plan.root + '/', ...rows.map((r, i) => `${i === rows.length - 1 ? '└─' : '├─'} ${r[0].padEnd(w)}  ${r[1]}`)].join('\n');
  }

  async function buildZip(projectId, onProgress) {
    const [p, zones, photos] = await Promise.all([S.store.get('projects', projectId), S.store.byIndex('zones', 'projectId', projectId), S.store.byIndex('photos', 'projectId', projectId)]);
    const plan = C.buildExportPlan(p, zones, photos);
    const now = new Date();
    const enc = new TextEncoder();
    const entries = [{ name: plan.root + '/', date: now }];
    plan.zones.forEach((z) => {
      entries.push({ name: `${plan.root}/${z.folder}/`, date: now });
      if ((z.zone.notes || '').trim()) entries.push({ name: `${plan.root}/${z.folder}/notes-zone.txt`, data: enc.encode(C.buildZoneNotesTxt(z.zone, p)), date: now });
    });
    let i = 0;
    for (const it of plan.items) {
      const rec = await S.store.get('files', it.photo.id);
      i++;
      if (rec && rec.buf) {
        const u8 = new Uint8Array(rec.buf);
        entries.push({ name: it.path, data: u8, crc: typeof rec.crc === 'number' ? rec.crc : C.crc32(u8), date: new Date(it.photo.createdAt) });
      }
      onProgress(i, plan.items.length);
      if (i % 8 === 0) await tick();
    }
    if ((p.notes || '').trim()) entries.push({ name: `${plan.root}/notes-generales.txt`, data: enc.encode(C.buildGeneralNotesTxt(p)), date: now });
    entries.push({ name: `${plan.root}/notes.csv`, data: enc.encode(C.buildCsv(plan)), date: now });
    entries.push({ name: `${plan.root}/inventaire.csv`, data: enc.encode(C.buildInventoryCsv(plan)), date: now });
    entries.push({ name: `${plan.root}/recapitulatif.html`, data: enc.encode(C.buildRecapHtml(plan, p, now.getTime())), date: now });
    entries.push({ name: `${plan.root}/audit.json`, data: enc.encode(C.buildAuditJson(plan, p, zones, { app: VERSION, exportedAt: now.getTime(), exportedBy: S.settings.auditor || '' })), date: now });
    return { blob: C.makeZip(entries), plan };
  }

  /* ---------- Import d'un audit partagé ---------- */
  /* Lecture du ZIP par morceaux (sans tout charger en mémoire) : répertoire central, puis chaque fichier à la demande. */
  async function readZipIndex(file) {
    const tailLen = Math.min(file.size, 65557);
    if (tailLen < 22) throw new Error('Ce fichier n’est pas un ZIP.');
    const tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
    let eocd = -1;
    for (let i = tailLen - 22; i >= 0; i--) { if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
    if (eocd < 0) throw new Error('Ce fichier n’est pas un ZIP.');
    const count = tail.getUint16(eocd + 10, true);
    const cdSize = tail.getUint32(eocd + 12, true);
    const cdOffset = tail.getUint32(eocd + 16, true);
    const cd = new DataView(await file.slice(cdOffset, cdOffset + cdSize).arrayBuffer());
    const dec = new TextDecoder();
    const entries = new Map();
    let o = 0;
    for (let k = 0; k < count && o + 46 <= cd.byteLength; k++) {
      if (cd.getUint32(o, true) !== 0x02014b50) throw new Error('ZIP endommagé.');
      const nlen = cd.getUint16(o + 28, true), xlen = cd.getUint16(o + 30, true), clen = cd.getUint16(o + 32, true);
      const e = {
        method: cd.getUint16(o + 10, true), crc: cd.getUint32(o + 16, true),
        csize: cd.getUint32(o + 20, true), off: cd.getUint32(o + 42, true),
        name: dec.decode(new Uint8Array(cd.buffer, o + 46, nlen)),
      };
      entries.set(e.name, e);
      o += 46 + nlen + xlen + clen;
    }
    return entries;
  }
  async function readZipEntry(file, e) {
    const lh = new DataView(await file.slice(e.off, e.off + 30).arrayBuffer());
    if (lh.getUint32(0, true) !== 0x04034b50) throw new Error('ZIP endommagé.');
    const start = e.off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    const part = file.slice(start, start + e.csize);
    if (e.method === 0) return part.arrayBuffer();
    if (e.method === 8 && typeof DecompressionStream === 'function') {
      return new Response(part.stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    }
    throw new Error('Format de compression non pris en charge.');
  }

  function onImportInput(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    S.queue = S.queue.then(() => prepareImport(file)).catch((e) => { busy(false); console.error(e); toast(errMsg(e), 6000); });
  }

  async function prepareImport(file) {
    await closeAllSheets();
    busy('Lecture du fichier…');
    let entries, inc, base;
    try {
      entries = await readZipIndex(file);
      const json = [...entries.values()].find((e) => /(^|\/)audit\.json$/.test(e.name));
      if (!json) throw new Error('Ce ZIP ne contient pas les données de l’app. Demande un export fait avec la version 0.3 ou plus récente.');
      inc = JSON.parse(new TextDecoder().decode(await readZipEntry(file, json)));
      if (!C.isAuditJson(inc)) throw new Error('Fichier d’audit non reconnu.');
      base = json.name.slice(0, json.name.length - 'audit.json'.length);
    } finally { busy(false); }
    const lp = await S.store.get('projects', inc.project.id);
    const local = {
      project: lp || null,
      zones: lp ? await S.store.byIndex('zones', 'projectId', lp.id) : [],
      photos: lp ? await S.store.byIndex('photos', 'projectId', lp.id) : [],
    };
    openImportSheet(file, entries, base, inc, C.planMerge(local, inc));
  }

  async function applyImport(file, entries, base, plan, onProgress) {
    await S.store.put('projects', plan.project);
    await S.store.batch([
      ...plan.zonesPut.map((z) => ({ store: 'zones', type: 'put', value: z })),
      ...plan.zonesDel.map((id) => ({ store: 'zones', type: 'del', key: id })),
    ]);
    if (plan.photosDel.length) await deletePhotos(plan.photosDel);
    const updates = plan.photosPut.filter((x) => !x.isNew);
    if (updates.length) await S.store.batch(updates.map((x) => ({ store: 'photos', type: 'put', value: x.photo })));
    const news = plan.photosPut.filter((x) => x.isNew);
    let missing = 0;
    for (let i = 0; i < news.length; i++) {
      const x = news[i];
      onProgress(i + 1, news.length);
      const e = entries.get(base + x.file);
      if (!e) { missing++; continue; }
      const buf = await readZipEntry(file, e);
      const type = x.photo.type || 'image/jpeg';
      let thumbBuf = null;
      try {
        const { img, url } = await loadImage(new Blob([buf], { type }));
        try { thumbBuf = await blobToBuf((await renderScaled(img, img.naturalWidth, img.naturalHeight, 480, 0.72)).blob); }
        finally { URL.revokeObjectURL(url); }
      } catch (err) { /* miniature impossible : la photo est quand même importée */ }
      const crc = e.method === 0 ? e.crc >>> 0 : C.crc32(new Uint8Array(buf));
      await S.store.batch([
        { store: 'files', type: 'put', value: { id: x.photo.id, buf, type, crc } },
        ...(thumbBuf ? [{ store: 'thumbs', type: 'put', value: { id: x.photo.id, buf: thumbBuf, type: 'image/jpeg' } }] : []),
        { store: 'photos', type: 'put', value: { ...x.photo, size: buf.byteLength } },
      ]);
    }
    // Les tags utilisés par le collègue rejoignent la liste de ce téléphone.
    const known = new Set(allTags().map((t) => C.normTag(t.name)));
    const fresh = [...new Set(plan.photosPut.map((x) => x.photo.label).filter((l) => l && !known.has(C.normTag(l))))];
    for (const l of fresh) await addCustomTag(l);
    return { missing };
  }

  /* ---------- Réglages ---------- */
  async function storageEstimate() { try { if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate(); } catch (e) { /* indisponible */ } return null; }
  async function isPersisted() { try { return !!(navigator.storage && navigator.storage.persisted && (await navigator.storage.persisted())); } catch (e) { return false; } }
  const canPersist = () => { try { return !!(navigator.storage && navigator.storage.persist); } catch (e) { return false; } };
  function requestPersistOnce() {
    if (S.inFrame || S.persistAsked || !canPersist()) return;
    S.persistAsked = true;
    navigator.storage.persist().catch(() => {});
  }

  async function openSettings() {
    const [est, persisted, photos] = await Promise.all([storageEstimate(), isPersisted(), S.store.all('photos').catch(() => [])]);
    const bytes = photos.reduce((t, p) => t + (p.size || 0), 0);
    const envNote = !S.durable
      ? `<div class="banner bad">${icon('info')}<span><strong>Stockage indisponible.</strong> Le navigateur bloque l’enregistrement ici : les photos disparaîtront à la fermeture de la page.</span></div>`
      : S.inFrame ? `<div class="banner info">${icon('info')}<span>Version de test ouverte dans Claude : les données restent sur cet appareil, mais le navigateur peut les effacer. Exporte chaque audit en ZIP.</span></div>` : '';
    const body = `
      <div class="field"><label for="st-auditor">Auditeur par défaut</label><input id="st-auditor" class="input" value="${esc(S.settings.auditor)}" placeholder="Ton nom" autocomplete="name"><p class="small">Prérempli à la création d’un audit.</p></div>
      <fieldset class="field"><legend class="flabel">Qualité des photos</legend>
        ${Object.entries(QUALITY).map(([k, q]) => `<label class="opt"><input type="radio" name="st-q" value="${k}"${S.settings.quality === k ? ' checked' : ''}><span><strong>${q.label}</strong><span class="small">${q.hint}</span></span></label>`).join('')}
      </fieldset>
      <div class="field"><span class="flabel">Stockage sur cet appareil</span>
        <p class="kv"><span>Photos enregistrées</span><strong>${plural(photos.length, 'photo', 'photos')} · ${fmtSize(bytes)}</strong></p>
        ${est && est.quota ? `<p class="kv"><span>Utilisé / disponible</span><strong>${fmtSize(est.usage)} / ${fmtSize(est.quota)}</strong></p>` : ''}
        <p class="kv"><span>Protection contre l’effacement</span><strong id="st-persist">${persisted ? 'activée' : 'non activée'}</strong></p>
        ${!persisted && canPersist() && !S.inFrame ? '<button type="button" class="btn" data-local="persist">Demander la protection des données</button>' : ''}
        ${envNote}
      </div>
      <div class="field"><span class="flabel">Tags</span>
        <p class="kv"><span>Tags disponibles</span><strong id="st-tags">${tagCountLabel()}</strong></p>
        <button type="button" class="btn" data-local="tags">${icon('tag')} Gérer les tags</button>
      </div>
      <button type="button" class="btn" data-local="seed">Recréer l’audit d’exemple</button>
      <p class="small">Carnet d’audit · version ${VERSION} · les photos restent sur cet appareil</p>`;
    const sheet = openSheet({ title: 'Réglages', body, foot: '<button type="button" class="btn primary" data-sheet-dismiss>Fermer</button>' });
    const el = sheet.el;
    $('#st-auditor', el).addEventListener('change', (e) => { S.settings.auditor = e.target.value.trim(); saveSettings(); });
    $$('input[name="st-q"]', el).forEach((r) => r.addEventListener('change', () => { S.settings.quality = r.value; saveSettings(); }));
    el.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-local]');
      if (!b) return;
      if (b.dataset.local === 'tags') {
        openTagManager(() => { const t = $('#st-tags', el); if (t) t.textContent = tagCountLabel(); });
      } else if (b.dataset.local === 'persist') {
        let ok = false;
        try { ok = await navigator.storage.persist(); } catch (err) { ok = false; }
        $('#st-persist', el).textContent = ok ? 'activée' : 'refusée par le navigateur';
        if (ok) b.remove();
      } else if (b.dataset.local === 'seed') {
        b.disabled = true;
        try { await seedExample(); await sheet.close(); S.nav = [{ name: 'home' }]; render(); toast('Audit d’exemple recréé'); }
        catch (err) { b.disabled = false; toast('Impossible de recréer l’exemple : ' + errMsg(err)); }
      }
    });
  }

  function tagCountLabel() {
    const n = allTags().length, added = S.tagMeta.custom.length;
    return `${n}${added ? ` dont ${plural(added, 'ajouté', 'ajoutés')}` : ''}`;
  }

  /* Liste des tags : rechercher, ajouter, retirer. Retirer un tag ne touche pas aux photos déjà taguées. */
  function openTagManager(onDone) {
    const body = `
      <div class="field"><label for="tm-q">Rechercher ou ajouter un tag</label>
        <div class="tagbox"><span class="tagbox-ic">${icon('search')}</span><input id="tm-q" class="input" type="text" placeholder="Ex. Borne de recharge" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></div>
      </div>
      <ul class="tm-list" id="tm-list"></ul>
      <p class="small">Retirer un tag ne modifie pas les photos déjà taguées. Les tags ajoutés restent sur ce téléphone.</p>`;
    const foot = '<button type="button" class="btn" data-local="reset">Rétablir les tags par défaut</button><button type="button" class="btn primary" data-sheet-dismiss>Fermer</button>';
    const sheet = openSheet({ title: 'Tags', body, foot, full: true, onClose: () => { if (onDone) onDone(); } });
    const el = sheet.el;
    const q = $('#tm-q', el), list = $('#tm-list', el);
    function draw() {
      const v = q.value.trim();
      const tags = allTags();
      const rows = v ? C.searchTags(tags, v).map((r) => r.tag) : [...tags].sort(byName);
      const exact = v && tags.some((t) => C.normTag(t.name) === C.normTag(v));
      list.innerHTML = (v && !exact ? `<li><button type="button" class="tag-opt add" data-add="${esc(v)}">${icon('plus')}<span>Ajouter le tag « ${esc(v)} »</span></button></li>` : '')
        + (rows.length ? rows.map((t) => `<li class="tm-row"><span class="tm-name">${esc(t.name)}${t.custom ? ' <span class="tm-badge">ajouté</span>' : ''}</span><button type="button" class="icon-btn sm danger" data-del="${esc(t.name)}" aria-label="Retirer le tag ${esc(t.name)}">${icon('trash')}</button></li>`).join('')
          : '<li class="tag-empty">Aucun tag ne correspond.</li>');
    }
    async function add(v) {
      const name = await addCustomTag(v);
      if (!name) return;
      q.value = '';
      draw();
      toast(`Tag « ${name} » disponible`);
    }
    draw();
    q.addEventListener('input', draw);
    q.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (q.value.trim()) add(q.value); } });
    el.addEventListener('click', async (e) => {
      const a = e.target.closest('[data-add]');
      if (a) { add(a.dataset.add); return; }
      const d = e.target.closest('[data-del]');
      if (d) { const saving = removeTag(d.dataset.del); draw(); toast(`Tag « ${d.dataset.del} » retiré`); await saving; return; }
      if (e.target.closest('[data-local="reset"]')) { S.tagMeta.hidden = []; draw(); toast('Tags par défaut rétablis'); await saveTags(); }
    });
  }

  /* ---------- Capture et import ---------- */
  let busyEl = null;
  function busy(msg) {
    if (msg === false) { if (busyEl) { busyEl.remove(); busyEl = null; } return; }
    if (!busyEl) {
      busyEl = document.createElement('div');
      busyEl.className = 'busy';
      busyEl.innerHTML = '<div class="busy-box" role="status" aria-live="polite"><span class="spinner"></span><span class="busy-msg"></span></div>';
      document.body.appendChild(busyEl);
    }
    $('.busy-msg', busyEl).textContent = msg;
  }
  let toastTimer = 0;
  function toast(msg, ms = 3000) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, ms);
  }

  function onFileInput(input) {
    const files = Array.from(input.files || []);
    input.value = '';
    const r = current();
    const zoneId = S.captureZoneId || (r.name === 'zone' ? r.id : null);
    S.captureZoneId = null;
    if (!files.length || !zoneId) return;
    S.queue = S.queue.then(() => ingest(files, zoneId)).catch((e) => { busy(false); console.error(e); toast('Import impossible : ' + errMsg(e)); });
  }

  async function ingest(files, zoneId) {
    await closeAllSheets();
    const zone = await S.store.get('zones', zoneId);
    if (!zone) { toast('Zone introuvable'); return; }
    const added = [];
    let failed = 0;
    for (let i = 0; i < files.length; i++) {
      busy(files.length > 1 ? `Import ${i + 1} sur ${files.length}…` : 'Enregistrement de la photo…');
      try { added.push(await addPhoto(zone, files[i])); }
      catch (e) {
        failed++;
        console.error(e);
        if (e && e.name === 'QuotaExceededError') { busy(false); toast('Stockage plein : exporte puis supprime d’anciens audits.', 5000); break; }
      }
    }
    busy(false);
    if (added.length) requestPersistOnce();
    await render(true);
    if (added.length === 1 && files.length === 1) openPhotoSheet(added[0].id);
    else if (added.length) toast(`${plural(added.length, 'photo importée', 'photos importées')}${failed ? `, ${failed} en échec` : ''} · à taguer`);
    else if (failed) toast('Impossible de lire cette image. Essaie avec une photo JPEG.', 5000);
  }

  /* ---------- Actions globales ---------- */
  const ACTIONS = {
    back: () => back(),
    settings: () => openSettings(),
    'new-project': () => openProjectSheet(null),
    'open-project': (el) => go({ name: 'project', id: el.dataset.id }),
    'edit-project': async () => { const p = await S.store.get('projects', current().id); if (p) openProjectSheet(p); },
    'add-zone': () => openZoneSheet(current().id, null),
    'toggle-organize': () => { S.organize = !S.organize; render(true); },
    'open-zone': (el) => go({ name: 'zone', id: el.dataset.id }),
    'zone-up': (el) => moveZone(el.dataset.id, -1),
    'zone-down': (el) => moveZone(el.dataset.id, 1),
    'edit-zone': async (el) => { const z = await S.store.get('zones', el.dataset.id || current().id); if (z) openZoneSheet(z.projectId, z); },
    'open-photo': (el) => openPhotoSheet(el.dataset.id),
    export: () => openExportSheet(current().id),
    'dismiss-hint': async () => { S.settings.hintDismissed = true; await saveSettings(); render(true); },
    'dismiss-install': async () => { S.settings.installDismissed = true; await saveSettings(); render(true); },
    install: async () => {
      if (!installPrompt) return;
      const p = installPrompt;
      installPrompt = null;
      try { await p.prompt(); await p.userChoice; } catch (e) { /* refusé */ }
      render(true);
    },
  };

  function bindEvents() {
    document.addEventListener('click', (e) => {
      const cap = e.target.closest('[data-capture]');
      if (cap) { S.captureZoneId = cap.dataset.capture; if (S.activePhoto) S.activePhoto.flush(); }
    }, true);
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      const fn = ACTIONS[el.dataset.act];
      if (fn) Promise.resolve(fn(el, e)).catch((err) => { console.error(err); toast('Action impossible : ' + errMsg(err)); });
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && S.sheets.length) { e.preventDefault(); S.sheets[S.sheets.length - 1].close(); return; }
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('label[role="button"]')) { e.preventDefault(); e.target.click(); }
    });
    document.addEventListener('input', (e) => {
      const t = e.target;
      if (!t.dataset || !t.dataset.notes) return;
      if (pendingNotes.id && pendingNotes.id !== t.dataset.id) flushNotes();
      Object.assign(pendingNotes, { kind: t.dataset.notes, id: t.dataset.id, value: t.value });
      clearTimeout(pendingNotes.timer);
      pendingNotes.timer = setTimeout(flushNotes, 600);
      autoGrow(t);
    });
    document.addEventListener('focusout', (e) => { if (e.target.dataset && e.target.dataset.notes) flushNotes(); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'hidden') return;
      flushNotes();
      if (S.activePhoto) S.activePhoto.flush();
    });
    $('#in-camera').addEventListener('change', (e) => onFileInput(e.target));
    $('#in-import').addEventListener('change', (e) => onImportInput(e.target));
    $('#in-gallery').addEventListener('change', (e) => onFileInput(e.target));
  }

  function initDownloads() {
    S.downloadsPromise = (async () => {
      for (let k = 0; k < 10 && !(window.claude && typeof window.claude.use === 'function'); k++) {
        if (!S.inFrame) break;
        await new Promise((r) => setTimeout(r, 300));
      }
      if (!(window.claude && typeof window.claude.use === 'function')) return null;
      try { return (await window.claude.use('downloads')) || null; } catch (e) { return null; }
    })().then((ns) => { S.downloads = ns; return ns; });
  }

  async function init() {
    bindEvents();
    initDownloads();
    try { S.store = new IdbStore(await idbOpen()); S.durable = true; }
    catch (e) { console.warn('Stockage en mémoire :', e); S.store = new MemStore(); S.durable = false; }
    await loadSettings();
    await loadTags();
    if (!S.settings.seeded) {
      try { await seedExample(); } catch (e) { console.warn('Exemple non créé :', e); }
      S.settings.seeded = true;
      await saveSettings();
    }
    setupHistory();
    setupPwa();
    await render();
  }

  init();
})();

</script>
</body>
</html>
