  async function openZoneSheet(projectId, zone, { first = false } = {}) {
    const isNew = !zone;
    const existing = await S.store.byIndex('zones', 'projectId', projectId);
    const body = `<form id="zn-form" class="form" novalidate>
      ${first ? '<p class="lead">Ajoute la première zone visitée. Tu pourras en créer d’autres à tout moment.</p>' : ''}
      <div class="field"><label for="zn-name">Nom de la zone</label><input id="zn-name" class="input" value="${esc(zone ? zone.name : '')}" placeholder="Ex. Local technique RDC" autocomplete="off" enterkeyhint="done"><p class="err" id="zn-err" hidden>Indique un nom de zone.</p></div>
      <div class="chips" role="group" aria-label="Zones courantes">${ZONE_PRESETS.map((z) => `<button type="button" class="chip" data-preset="${esc(z)}">${esc(z)}</button>`).join('')}</div>
      ${isNew ? '' : `<button type="button" class="btn danger" data-local="delete-zone">${icon('trash')} Supprimer cette zone</button>`}
    </form>`;
    const foot = `<button type="button" class="btn" data-sheet-dismiss>${first ? 'Plus tard' : 'Annuler'}</button><button type="submit" form="zn-form" class="btn primary" id="zn-submit">${isNew ? 'Ajouter la zone' : 'Renommer'}</button>`;
    const sheet = openSheet({ title: isNew ? 'Nouvelle zone' : 'Modifier la zone', body, foot });
    const form = $('#zn-form', sheet.el);
    const input = $('#zn-name', form);
    sheet.el.addEventListener('click', async (e) => {
      const chipEl = e.target.closest('[data-preset]');
      if (chipEl) {
        const base = chipEl.dataset.preset;
        const taken = (n) => existing.some((z) => (!zone || z.id !== zone.id) && z.name.toLowerCase() === n.toLowerCase());
        let name = base;
        for (let k = 2; taken(name); k++) name = `${base} ${k}`;
        input.value = name;
        $('#zn-err', form).hidden = true;
        return;
      }
      if (e.target.closest('[data-local="delete-zone"]')) {
        const ps = await S.store.byIndex('photos', 'zoneId', zone.id);
        const ok = await confirmBox(`Supprimer la zone « ${esc(zone.name)} »${ps.length ? ` et ses ${plural(ps.length, 'photo', 'photos')}` : ''} ?`, { ok: 'Supprimer la zone' });
        if (!ok) return;
        await deleteZone(zone.id);
        await sheet.close();
        if (current().name === 'zone' && current().id === zone.id) back(); else render(true);
        toast('Zone supprimée');
      }
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) { $('#zn-err', form).hidden = false; input.focus(); return; }
      try {
        if (isNew) {
          const order = existing.reduce((m, z) => Math.max(m, z.order || 0), -1) + 1;
          const nz = { id: uid(), projectId, name, order, createdAt: Date.now() };
          await S.store.put('zones', nz);
          S.flashZone = nz.id;
          await sheet.close();
          await render(true);
          toast(`Zone « ${name} » ajoutée`);
        } else {
          const cur = await S.store.get('zones', zone.id);
          cur.name = name;
          await S.store.put('zones', cur);
          await sheet.close();
          render(true);
        }
      } catch (err) { toast('Enregistrement impossible : ' + errMsg(err)); }
    });
  }

  async function moveZone(zoneId, dir) {
    const r = current();
    if (r.name !== 'project') return;
    const zs = C.sortZones(await S.store.byIndex('zones', 'projectId', r.id));
    const i = zs.findIndex((z) => z.id === zoneId), j = i + dir;
    if (i < 0 || j < 0 || j >= zs.length) return;
    [zs[i], zs[j]] = [zs[j], zs[i]];
    await S.store.batch(zs.map((z, k) => ({ store: 'zones', type: 'put', value: { ...z, order: k } })));
    await render(true);
    const btn = $(`[data-act="${dir < 0 ? 'zone-up' : 'zone-down'}"][data-id="${zoneId}"]`);
    if (btn && !btn.disabled) btn.focus({ preventScroll: true });
  }

  /* ---------- Export ---------- */
  function buildTree(plan) {
    const rows = plan.zones.map((z) => [`${z.folder}/`, plural(z.items.length, 'photo', 'photos')]);
    rows.push(['notes.csv', 'tableau'], ['recapitulatif.html', 'à imprimer']);
    const w = Math.max(...rows.map((r) => r[0].length));
    return [plan.root + '/', ...rows.map((r, i) => `${i === rows.length - 1 ? '└─' : '├─'} ${r[0].padEnd(w)}  ${r[1]}`)].join('\n');
  }

  async function buildZip(projectId, onProgress) {
    const [p, zones, photos] = await Promise.all([S.store.get('projects', projectId), S.store.byIndex('zones', 'projectId', projectId), S.store.byIndex('photos', 'projectId', projectId)]);
    const plan = C.buildExportPlan(p, zones, photos);
    const now = new Date();
    const enc = new TextEncoder();
    const entries = [{ name: plan.root + '/', date: now }];
    plan.zones.forEach((z) => entries.push({ name: `${plan.root}/${z.folder}/`, date: now }));
    let i = 0;
    for (const it of plan.items) {
      const rec = await S.store.get('files', it.photo.id);
      i++;
      if (rec && rec.buf) {
        const u8 = new Uint8Array(rec.buf);
        entries.push({ name: it.path, data: u8, crc: typeof rec.crc === 'number' ? rec.crc : C.crc32(u8), date: new Date(it.photo.createdAt) });
      }
      onProgress(i, plan.items.length);
      if (i % 8 === 0) await tick();
    }
    entries.push({ name: `${plan.root}/notes.csv`, data: enc.encode(C.buildCsv(plan)), date: now });
    entries.push({ name: `${plan.root}/recapitulatif.html`, data: enc.encode(C.buildRecapHtml(plan, p, now.getTime())), date: now });
    return { blob: C.makeZip(entries), plan };
  }

  function saveViaAnchor(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  async function openExportSheet(projectId) {
    const [p, zones, photos] = await Promise.all([S.store.get('projects', projectId), S.store.byIndex('zones', 'projectId', projectId), S.store.byIndex('photos', 'projectId', projectId)]);
    if (!p) return;
    const plan = C.buildExportPlan(p, zones, photos);
    const s = summarize(photos);
    const filename = `Audit_${plan.root}.zip`;
    const body = `
      <p class="lead">Un dossier par zone, les photos renommées avec leur numéro et leur libellé, le tableau des notes et un récapitulatif imprimable.</p>
      <pre class="tree" aria-label="Contenu du ZIP">${esc(buildTree(plan))}</pre>
      ${s.todo ? `<div class="banner">${icon('info')}<span>${plural(s.todo, 'photo n’a pas de libellé', 'photos n’ont pas de libellé')} : ${s.todo > 1 ? 'elles seront nommées' : 'elle sera nommée'} « sans-libelle ».</span></div>` : ''}
      <div id="ex-state" class="ex-state" aria-live="polite"></div>
      <button type="button" class="btn ghost" data-local="copy">${icon('copy')} Copier le tableau des notes</button>`;
    const foot = `<button type="button" class="btn primary big" data-local="build">${icon('download')} Préparer le ZIP · ${fmtSize(s.bytes + 30000)}</button>`;
    let blob = null;
    const sheet = openSheet({ title: 'Exporter l’audit', body, foot, onClose: () => { blob = null; } });
    const el = sheet.el;
    const state = $('#ex-state', el);
    const footEl = $('.sheet-foot', el);

    async function showReady() {
      state.innerHTML = `<div class="ready">${icon('check')}<span><strong class="mono">${esc(filename)}</strong><br><span class="small">${fmtSize(blob.size)} · ${plural(plan.items.length, 'photo', 'photos')}</span></span></div>`;
      if (S.inFrame && S.downloads === undefined) {
        footEl.innerHTML = '<p class="small">Préparation de l’enregistrement…</p>';
        await S.downloadsPromise;
      }
      if (S.downloads) {
        footEl.innerHTML = `<button type="button" class="btn primary big" data-local="save">${icon('download')} Enregistrer le ZIP</button>`;
      } else if (!S.inFrame) {
        let canShare = false;
        try { canShare = !!(navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: 'application/zip' })] })); } catch (e) { canShare = false; }
        footEl.innerHTML = `${canShare ? `<button type="button" class="btn" data-local="share">${icon('share')} Partager…</button>` : ''}<button type="button" class="btn primary big" data-local="download">${icon('download')} Télécharger</button>`;
      } else {
        footEl.innerHTML = '<p class="small">L’enregistrement de fichiers n’est pas disponible dans cette vue. Ouvre l’app depuis claude.ai ou l’app Claude.</p>';
      }
    }

    el.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-local]');
      if (!b) return;
      const act = b.dataset.local;
      if (act === 'build') {
        b.disabled = true;
        state.innerHTML = '<div class="progress"><i></i></div><p class="small" id="ex-prog">Préparation…</p>';
        try {
          const res = await buildZip(projectId, (i, n) => {
            const bar = $('.progress i', state); if (bar) bar.style.width = `${Math.round((i / Math.max(1, n)) * 100)}%`;
            const t = $('#ex-prog', state); if (t) t.textContent = `Préparation… ${i}/${n} photos`;
          });
          blob = res.blob;
          await showReady();
        } catch (err) {
          state.innerHTML = `<div class="banner bad">${icon('info')}<span>Export impossible : ${esc(errMsg(err))}</span></div>`;
          b.disabled = false;
        }
      } else if (act === 'save' && blob) {
        const dl = S.downloads;
        if (!dl) { toast('Enregistrement indisponible dans cette vue'); return; }
        try {
          await dl.save({ filename, data: blob });
          toast('Export terminé');
        } catch (err) {
          const code = err && err.code;
          if (code === 'declined') toast('Enregistrement annulé');
          else if (code === 'rate_limited') toast('Une demande est déjà ouverte. Réessaie dans un instant.');
          else if (code === 'too_large') toast('Fichier trop lourd pour cette vue. Passe la qualité photo en « Optimisée ».');
          else toast('Enregistrement indisponible dans cette vue');
        }
      } else if (act === 'share' && blob) {
        try { await navigator.share({ files: [new File([blob], filename, { type: 'application/zip' })], title: filename }); }
        catch (err) { if (!err || err.name !== 'AbortError') toast('Partage impossible : utilise « Télécharger »'); }
      } else if (act === 'download' && blob) {
        saveViaAnchor(blob, filename);
        toast('Téléchargement lancé');
      } else if (act === 'copy') {
        try { await navigator.clipboard.writeText(C.buildTsv(plan)); toast('Tableau copié : colle-le dans Excel ou Word'); }
        catch (err) { toast('Copie refusée par le navigateur'); }
      }
    });
  }

  /* ---------- Réglages ---------- */
  async function storageEstimate() { try { if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate(); } catch (e) { /* indisponible */ } return null; }
  async function isPersisted() { try { return !!(navigator.storage && navigator.storage.persisted && (await navigator.storage.persisted())); } catch (e) { return false; } }
  const canPersist = () => { try { return !!(navigator.storage && navigator.storage.persist); } catch (e) { return false; } };
  function requestPersistOnce() {
    if (S.inFrame || S.persistAsked || !canPersist()) return;
    S.persistAsked = true;
    navigator.storage.persist().catch(() => {});
  }

  async function openSettings() {
    const [est, persisted, photos] = await Promise.all([storageEstimate(), isPersisted(), S.store.all('photos').catch(() => [])]);
    const bytes = photos.reduce((t, p) => t + (p.size || 0), 0);
    const envNote = !S.durable
      ? `<div class="banner bad">${icon('info')}<span><strong>Stockage indisponible.</strong> Le navigateur bloque l’enregistrement ici : les photos disparaîtront à la fermeture de la page.</span></div>`
      : S.inFrame ? `<div class="banner info">${icon('info')}<span>Version de test ouverte dans Claude : les données restent sur cet appareil, mais le navigateur peut les effacer. Exporte chaque audit en ZIP.</span></div>` : '';
    const body = `
      <div class="field"><label for="st-auditor">Auditeur par défaut</label><input id="st-auditor" class="input" value="${esc(S.settings.auditor)}" placeholder="Ton nom" autocomplete="name"><p class="small">Prérempli à la création d’un audit.</p></div>
      <fieldset class="field"><legend class="flabel">Qualité des photos</legend>
        ${Object.entries(QUALITY).map(([k, q]) => `<label class="opt"><input type="radio" name="st-q" value="${k}"${S.settings.quality === k ? ' checked' : ''}><span><strong>${q.label}</strong><span class="small">${q.hint}</span></span></label>`).join('')}
      </fieldset>
      <div class="field"><span class="flabel">Stockage sur cet appareil</span>
        <p class="kv"><span>Photos enregistrées</span><strong>${plural(photos.length, 'photo', 'photos')} · ${fmtSize(bytes)}</strong></p>
        ${est && est.quota ? `<p class="kv"><span>Utilisé / disponible</span><strong>${fmtSize(est.usage)} / ${fmtSize(est.quota)}</strong></p>` : ''}
        <p class="kv"><span>Protection contre l’effacement</span><strong id="st-persist">${persisted ? 'activée' : 'non activée'}</strong></p>
        ${!persisted && canPersist() && !S.inFrame ? '<button type="button" class="btn" data-local="persist">Demander la protection des données</button>' : ''}
        ${envNote}
      </div>
      <button type="button" class="btn" data-local="seed">Recréer l’audit d’exemple</button>
      <p class="small">Carnet d’audit · version ${VERSION} · les photos restent sur cet appareil</p>`;
    const sheet = openSheet({ title: 'Réglages', body, foot: '<button type="button" class="btn primary" data-sheet-dismiss>Fermer</button>' });
    const el = sheet.el;
    $('#st-auditor', el).addEventListener('change', (e) => { S.settings.auditor = e.target.value.trim(); saveSettings(); });
    $$('input[name="st-q"]', el).forEach((r) => r.addEventListener('change', () => { S.settings.quality = r.value; saveSettings(); }));
    el.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-local]');
      if (!b) return;
      if (b.dataset.local === 'persist') {
        let ok = false;
        try { ok = await navigator.storage.persist(); } catch (err) { ok = false; }
        $('#st-persist', el).textContent = ok ? 'activée' : 'refusée par le navigateur';
        if (ok) b.remove();
      } else if (b.dataset.local === 'seed') {
        b.disabled = true;
        try { await seedExample(); await sheet.close(); S.nav = [{ name: 'home' }]; render(); toast('Audit d’exemple recréé'); }
        catch (err) { b.disabled = false; toast('Impossible de recréer l’exemple : ' + errMsg(err)); }
      }
    });
  }

  /* ---------- Capture et import ---------- */
  let busyEl = null;
  function busy(msg) {
    if (msg === false) { if (busyEl) { busyEl.remove(); busyEl = null; } return; }
    if (!busyEl) {
      busyEl = document.createElement('div');
      busyEl.className = 'busy';
      busyEl.innerHTML = '<div class="busy-box" role="status" aria-live="polite"><span class="spinner"></span><span class="busy-msg"></span></div>';
      document.body.appendChild(busyEl);
    }
    $('.busy-msg', busyEl).textContent = msg;
  }
  let toastTimer = 0;
  function toast(msg, ms = 3000) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, ms);
  }

  function onFileInput(input) {
    const files = Array.from(input.files || []);
    input.value = '';
    const r = current();
    const zoneId = S.captureZoneId || (r.name === 'zone' ? r.id : null);
    S.captureZoneId = null;
    if (!files.length || !zoneId) return;
    S.queue = S.queue.then(() => ingest(files, zoneId)).catch((e) => { busy(false); console.error(e); toast('Import impossible : ' + errMsg(e)); });
  }

  async function ingest(files, zoneId) {
    await closeAllSheets();
    const zone = await S.store.get('zones', zoneId);
    if (!zone) { toast('Zone introuvable'); return; }
    const added = [];
    let failed = 0;
    for (let i = 0; i < files.length; i++) {
      busy(files.length > 1 ? `Import ${i + 1} sur ${files.length}…` : 'Enregistrement de la photo…');
      try { added.push(await addPhoto(zone, files[i])); }
      catch (e) {
        failed++;
        console.error(e);
        if (e && e.name === 'QuotaExceededError') { busy(false); toast('Stockage plein : exporte puis supprime d’anciens audits.', 5000); break; }
      }
    }
    busy(false);
    if (added.length) requestPersistOnce();
    await render(true);
    if (added.length === 1 && files.length === 1) openPhotoSheet(added[0].id);
    else if (added.length) toast(`${plural(added.length, 'photo importée', 'photos importées')}${failed ? `, ${failed} en échec` : ''} · à annoter`);
    else if (failed) toast('Impossible de lire cette image. Essaie avec une photo JPEG.', 5000);
  }

  /* ---------- Actions globales ---------- */
  const ACTIONS = {
    back: () => back(),
    settings: () => openSettings(),
    'new-project': () => openProjectSheet(null),
    'open-project': (el) => go({ name: 'project', id: el.dataset.id }),
    'edit-project': async () => { const p = await S.store.get('projects', current().id); if (p) openProjectSheet(p); },
    'add-zone': () => openZoneSheet(current().id, null),
    'toggle-organize': () => { S.organize = !S.organize; render(true); },
    'open-zone': (el) => go({ name: 'zone', id: el.dataset.id }),
    'zone-up': (el) => moveZone(el.dataset.id, -1),
    'zone-down': (el) => moveZone(el.dataset.id, 1),
    'edit-zone': async (el) => { const z = await S.store.get('zones', el.dataset.id || current().id); if (z) openZoneSheet(z.projectId, z); },
    'open-photo': (el) => openPhotoSheet(el.dataset.id),
    export: () => openExportSheet(current().id),
    'dismiss-hint': async () => { S.settings.hintDismissed = true; await saveSettings(); render(true); },
    'dismiss-install': async () => { S.settings.installDismissed = true; await saveSettings(); render(true); },
    install: async () => {
      if (!installPrompt) return;
      const p = installPrompt;
      installPrompt = null;
      try { await p.prompt(); await p.userChoice; } catch (e) { /* refusé */ }
      render(true);
    },
  };

  function bindEvents() {
    document.addEventListener('click', (e) => {
      const cap = e.target.closest('[data-capture]');
      if (cap) { S.captureZoneId = cap.dataset.capture; if (S.activePhoto) S.activePhoto.flush(); }
    }, true);
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      const fn = ACTIONS[el.dataset.act];
      if (fn) Promise.resolve(fn(el, e)).catch((err) => { console.error(err); toast('Action impossible : ' + errMsg(err)); });
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && S.sheets.length) { e.preventDefault(); S.sheets[S.sheets.length - 1].close(); return; }
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('label[role="button"]')) { e.preventDefault(); e.target.click(); }
    });
    $('#in-camera').addEventListener('change', (e) => onFileInput(e.target));
    $('#in-gallery').addEventListener('change', (e) => onFileInput(e.target));
  }

  function initDownloads() {
    S.downloadsPromise = (async () => {
      for (let k = 0; k < 10 && !(window.claude && typeof window.claude.use === 'function'); k++) {
        if (!S.inFrame) break;
        await new Promise((r) => setTimeout(r, 300));
      }
      if (!(window.claude && typeof window.claude.use === 'function')) return null;
      try { return (await window.claude.use('downloads')) || null; } catch (e) { return null; }
    })().then((ns) => { S.downloads = ns; return ns; });
  }

  async function init() {
    bindEvents();
    initDownloads();
    try { S.store = new IdbStore(await idbOpen()); S.durable = true; }
    catch (e) { console.warn('Stockage en mémoire :', e); S.store = new MemStore(); S.durable = false; }
    await loadSettings();
    if (!S.settings.seeded) {
      try { await seedExample(); } catch (e) { console.warn('Exemple non créé :', e); }
      S.settings.seeded = true;
      await saveSettings();
    }
    setupHistory();
    setupPwa();
    await render();
  }

  init();
})();

</script>
</body>
</html>
